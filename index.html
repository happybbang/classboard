{font-size:32px}.celebrate{animation:pop .5s ease}@keyframes pop{0%{transform:scale(.7);opacity:.1}75%{transform:scale(1.05)}100%{transform:scale(1)}}.hide{display:none!important}.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.weekbar input{max-width:180px}.bullet{background:#f3f7fd;padding:11px;border-radius:12px;margin:8px 0}.records{max-height:480px;overflow:auto}.record{padding:12px;border-bottom:1px solid #e7edf5}.center{text-align:center}.poster{border:6px solid #ffe084;border-radius:20px;padding:18px;background:#fff;margin:10px auto;width:100%;max-width:680px;break-inside:avoid}.poster h1{font-size:35px;text-align:center;color:#1b65c1;margin:10px}.poster .posterprom{background:#fce7ec;text-align:center;padding:12px;border-radius:16px;font-size:24px;font-weight:950}.poster img{height:390px;width:100%;object-fit:contain}.poster .day{height:80px}.print-only{display:none}.chip{border-radius:20px;background:#e9eefb;padding:6px 11px;font-weight:800;font-size:12px}section h2{margin:0 0 14px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:13px 22px;background:#213349;color:#fff;border-radius:14px;z-index:100;display:none}.focusnav{display:flex;justify-content:space-between;gap:10px;align-items:center}.mini-progress{font-size:13px;color:#597392}.settinglabel{font-size:14px;font-weight:850}.large-emoji{font-size:70px;display:block}.actionrow{display:flex;gap:20px;align-items:center}.actionrow>div:first-child{font-size:68px} .chartcol{background:#80b3f8;border-radius:8px 8px 0 0;min-height:2px}.chartbox{height:145px;display:flex;align-items:end;gap:10px;border-bottom:2px solid #ccd7e4;padding-top:5px}.colouter{flex:1;text-align:center;font-size:12px}.colouter strong{display:block}.safe{background:#eaf9f1;padding:12px;border-radius:13px;color:#2a7256}.warning{background:#fff5dd;padding:12px;border-radius:13px;color:#805819}.choice{padding:9px 12px;border:2px solid #e4ebf5;border-radius:12px;cursor:pointer}.choice.checked{background:#eaf6ff;border-color:#6da9ed}.chartlabels{display:flex;gap:10px}.printhead{font-weight:950;font-size:23px}.separator{border:0;border-top:1px solid #e5ebf3;margin:18px 0} @media(max-width:760px){.present .preview-img{min-height:240px;height:320px}.grid,.grid3{grid-template-columns:1fr}.brand{font-size:23px}.shell{padding:9px}.panel{padding:13px}.present .day strong{font-size:23px}.actionrow{gap:9px}.actionrow>div:first-child{font-size:45px}}@media print{body{background:white}.no-print,.tabs,.header,.toast{display:none!important}.shell{max-width:none;padding:0}.panel{box-shadow:none;border:0;padding:0}.print-only{display:block}.poster{page-break-after:always;max-width:none;width:180mm;min-height:260mm;margin:0 auto;padding:16mm 10mm}.poster img{height:145mm}.poster h1{font-size:38px}.poster:last-child{page-break-after:auto}.paperpage{break-after:page;padding:12mm}.paperpage:last-child{break-after:auto} @page{size:A4;margin:8mm}}

</style></head><body><div class="shell"><header class="header no-print"><div><div class="brand">☀️ 해오름반 <span>약속 돌아보기</span></div><div class="sub">칭찬받은 행동을 기억하고, 다음 도전을 함께 준비해요</div></div><div class="weekbar"><label class="settinglabel">주간 시작(월) <input id="week" type="date"></label><button onclick="prevWeek()">◀ 지난주</button><button onclick="nextWeek()">다음주 ▶</button></div></header><nav class="tabs no-print" id="tabs"><button data-tab="home" class="active" onclick="tab('home')">🏠 전체 현황</button><button data-tab="edit" onclick="tab('edit')">✏️ 약속·점수 입력</button><button data-tab="coach" onclick="tab('coach')">💡 행동 지도 카드</button><button data-tab="present" onclick="tab('present')">🎉 금요일 발표</button><button data-tab="badges" onclick="tab('badges')">🏅 배지 도감</button><button data-tab="history" onclick="tab('history')">📈 성장 기록</button><button data-tab="print" onclick="tab('print')">🖨️ 인쇄</button><button data-tab="settings" onclick="tab('settings')">⚙️ 백업·설정</button></nav><main id="app"></main></div><div class="toast" id="toast"></div><script>
const IMGS=Array(7).fill('data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440"><rect width="600" height="440" rx="30" fill="#eaf0fb"/><circle cx="300" cy="170" r="85" fill="#ffca65"/><path d="M258 170l30 30 58-62" fill="none" stroke="#31517b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="320" text-anchor="middle" font-size="32" fill="#31517b">나의 약속</text></svg>'));
const starter=Array.from({length:7},(_,i)=>['학생 '+(i+1),'이번 주 약속을 정해요','어떻게 실천할지 생각해요','✅']);
const badgeTypes=[['예쁜 말','💬'],['도전','🚀'],['집중','📚'],['경청','👂'],['배려','💗'],['스스로','🎒'],['청결','🧼'],['성장','🌱'],['특별 칭찬','🌟']];
const icons=['💬','🚀','📖','👂','💗','🎒','🧼','✋','🤝','😊','🌱','✨','🧩','🎨','🗣️','🧘','🙋','✅'];
const DAYS=['월','화','수','목','금'];const KEY='haeoreum_classroom_v1';
const base=()=>({students:starter.map((s,i)=>({id:'s'+i,name:s[0],promise:s[1],how:s[2],icon:s[3],img:i})),weeks:{},badges:[],cards:[],attendance:[true,true,true,true,true,true,false]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||base()}catch(e){db=base()}let selected=0,dayIdx=0,mode='home',presentIdx=0,presentPeople=[],cardEditing=null,printType='poster',printAll=true,chartSelected=0,selectedIcon='💬';
const pad=n=>String(n).padStart(2,'0');function monday(d){let t=new Date(d+'T12:00:00');if(isNaN(t))t=new Date();t.setDate(t.getDate()-(t.getDay()+6)%7);return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`};let week=monday(new Date().toISOString().slice(0,10));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('저장 공간이 부족합니다. 설정에서 백업을 내려받아 주세요.');return false}}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}function record(i,w=week){db.weeks[w]??={};db.weeks[w][db.students[i].id]??={scores:[null,null,null,null,null],plus:[0,0,0,0,0],notes:['','','','',''],positive:'',practice:'',next:'',promise:db.students[i].promise,how:db.students[i].how,icon:db.students[i].icon,positiveIcon:'🌟',practiceIcon:'💡'};return db.weeks[w][db.students[i].id]};function weekDates(){let d=new Date(week+'T12:00:00');return DAYS.map((a,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return `${a} ${x.getMonth()+1}/${x.getDate()}`})}function total(r){return r.scores.reduce((n,x,i)=>n+(x===null?0:Number(x)+Number(r.plus[i]||0)),0)}function getBadges(i){return db.badges.filter(b=>b.sid===db.students[i].id)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function moveWeek(n){let d=new Date(week+'T12:00:00');d.setDate(d.getDate()+7*n);week=monday(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);render()}function prevWeek(){moveWeek(-1)}function nextWeek(){moveWeek(1)}function tab(t){mode=t;render();window.scrollTo({top:0,behavior:'instant'})}function switchStudent(i){selected=i;coachUploadImage=null;render()}function render(){document.getElementById('week').value=week;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===mode));document.getElementById('app').innerHTML=({home:home,edit:edit,coach:coach,present:present,badges:badges,history:history,print:printView,settings:settings})[mode]();}
function home(){return `<section class="panel"><div class="row between"><h2>☀️ 이번 주 일곱 명의 약속</h2><span class="pill">${week} 시작</span></div><p class="hint">학생 카드를 누르면 약속과 점수를 수정할 수 있습니다. 값이 없는 날은 아직 평가하지 않은 날입니다.</p><div class="grid3">${db.students.map((s,i)=>{let r=record(i);return `<button class="student-card" onclick="selected=${i};tab('edit')"><img class="portrait" src="${studentPoster(s)}"><div style="flex:1"><div class="name">${esc(s.name)} <small class="muted" style="font-size:12px">${db.attendance[i]?'금요일 참석':'발표 제외'}</small></div><p style="font-size:14px;margin:5px 0">${esc(r.promise)}</p><div class="row">${r.scores.map((x,j)=>`<span class="chip">${DAYS[j]} ${x===null?'–':x+(r.plus[j]?'+'+r.plus[j]:'')}</span>`).join('')}</div><div style="margin-top:8px;font-weight:900;color:#2474d2">총점 ${total(r)}점</div></div></button>`}).join('')}</div></section><section class="panel"><h2>🎉 금요일 15분 발표 준비</h2><p>준비가 된 학생만 선택해 발표할 수 있습니다. 현재 <b>${db.attendance.filter(Boolean).length}명</b> 선택되어 있습니다.</p><div class="row">${db.students.map((s,i)=>`<label class="choice ${db.attendance[i]?'checked':''}"><input style="width:auto" type="checkbox" ${db.attendance[i]?'checked':''} onchange="toggleAttend(${i},this.checked)"> ${esc(s.name)}</label>`).join('')}</div><p class="hint">발표 전 교사 화면에서 칭찬 행동·다음 행동을 적어 주세요. 다른 학생의 부족한 점을 공개하지 않도록 연습 행동 카드는 발표 시 숨길 수도 있습니다.</p><button class="primary" onclick="startPresent()">▶ 선택한 학생 발표 시작</button></section>`}

function edit(){let s=db.students[selected],r=record(selected);return `<section class="panel"><div class="row between"><h2>✏️ 학생별 약속과 점수</h2><span class="pill">자동 저장</span></div><div class="row">${db.students.map((x,i)=>`<button class="${i===selected?'active':''}" onclick="switchStudent(${i})">${esc(x.name)}</button>`).join('')}</div></section><div class="grid"><section class="panel"><div class="row"><img class="edit-promise-img" src="${studentPoster(s)}"><div><h2>${esc(s.name)}의 약속</h2><p class="hint">이 주차에 적용된 약속은 개별 보관됩니다.</p></div></div><label class="label">이번 주 약속</label><input id="promise" value="${esc(r.promise)}" oninput="updateField('promise',this.value)"><label class="label">약속을 지키는 방법</label><textarea oninput="updateField('how',this.value)">${esc(r.how)}</textarea><p class="hint">약속을 바꾸면 현재 주에만 적용됩니다. 원본 약속판 이미지는 기존 그림으로 남아 있습니다.</p><button onclick="applyPromiseToFuture()">이 약속을 다음 새 주차의 기본값으로 저장</button></section><section class="panel"><h2>⭐ 월~금 점수 입력</h2><div class="day-row">${r.scores.map((x,i)=>`<button class="day ${dayIdx===i?'selected-day':''}" onclick="dayIdx=${i};render()"><small>${DAYS[i]}</small><strong>${x===null?'–':x}${r.plus[i]?'⁺'+r.plus[i]:''}</strong></button>`).join('')}</div><p class="label">${weekDates()[dayIdx]} · 기본 점수(0~5점)</p><div class="scorebuttons">${[0,1,2,3,4,5].map(n=>`<button class="${r.scores[dayIdx]===n?'active':''}" onclick="score(${n})">${n}점</button>`).join('')}<button onclick="score(null)">미입력</button></div><p class="label">특별 칭찬 점수 (+ 표시 1개 = 1점)</p><div class="row"><button onclick="bonus(-1)">－</button><strong class="stat">+${r.plus[dayIdx]}</strong><button onclick="bonus(1)">＋</button></div><label class="label">그날의 짧은 관찰 기록</label><textarea oninput="noteChange(this.value)">${esc(r.notes[dayIdx])}</textarea><hr class="separator"><div class="row between"><b>이번 주 총점</b><strong class="stat">${total(r)}점</strong></div><p class="hint">미입력 날짜는 총점 계산에서 제외합니다. 기록하지 않은 날을 0점으로 간주하지 않습니다.</p></section></div><section class="pan function coach(){let s=db.students[selected];return `<section class="panel"><h2>💡 행동 지도 카드 만들기</h2><p class="warning"><b>안내:</b> 이 오프라인 버전은 AI에 연결되어 있지 않습니다. 교사의 입력에 따라 쉬운 문장을 직접 작성하고, 준비된 대체 행동 예시를 선택해 2컷 카드로 보여줍니다. 새로운 상황의 AI 자동 그림 생성은 지원하지 않습니다.</p><div class="row">${db.students.map((x,i)=>`<button class="${selected===i?'active':''}" onclick="switchStudent(${i})">${esc(x.name)}</button>`).join('')}</div></section><div class="grid"><section class="panel"><h2>📝 ${esc(s.name)} 지도 내용</h2><label class="label">관찰한 상황</label><textarea id="situation" placeholder="예: 친구가 먼저 이야기하는데 중간에 끼어들었어요."></textarea><label class="label">다음에 실천할 대체 행동</label><textarea id="alternative" placeholder="예: 친구 말이 끝나면 내 차례에 이야기해요."></textarea><label class="label">쉽게 설명하는 한마디</label><input id="coachLine" placeholder="예: 차례를 기다리면 서로 이야기하기 좋아요."><input type="hidden" id="coachIcon" value="💡"><div class="coach-upload" style="margin-top:17px"><label class="label" for="coachUpload">🖼️ 선생님이 만든 지도 그림 첨부</label><p class="hint">JPG, PNG, WEBP 이미지를 선택하세요. 가로·세로 비율을 유지해 자동으로 크기를 줄이고 이 브라우저에 저장합니다.</p><input id="coachUpload" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewCoachUpload(this.files[0])"><div id="coachUploadPreview" class="coach-preview"><img id="coachUploadImage" class="coach-img" alt="첨부할 지도 그림 미리보기"><div class="row" style="margin-top:8px;justify-content:center"><button onclick="clearCoachUpload()">그림 선택 취소</button></div></div></div><p class="label">자주 사용하는 예시</p>${suggestions.map((x,j)=>`<button style="margin:3px" onclick="fillCoach(${j})">${esc(x[1])}</button>`).join('')}<div class="row" style="margin-top:16px"><button class="green" onclick="createCard()">✔ 지도 카드 저장</button></div></section><section class="panel"><h2>🖼️ 저장한 2컷 지도 카드</h2>${db.cards.filter(c=>c.sid===s.id).slice().reverse().map(c=>`<div class="bullet"><div class="row between"><b>${esc(c.date)} · ${esc(c.alt)}</b><button onclick="removeCard('${c.id}')">삭제</button></div>${c.image?`<img class="coach-img" loa let coachUploadImage=null;
function clearCoachUpload(){
  coachUploadImage=null;
  const input=document.getElementById('coachUpload');if(input)input.value='';
  const box=document.getElementById('coachUploadPreview');if(box)box.style.display='none';
}
function previewCoachUpload(file){
  if(!file)return;
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){alert('JPG, PNG, WEBP 이미지만 첨부할 수 있습니다.');clearCoachUpload();return;}
  if(file.size>20*1024*1024){alert('20MB 이하 이미지를 선택해 주세요.');clearCoachUpload();return;}
  const reader=new FileReader();
  reader.onerror=()=>{alert('이미지를 읽을 수 없습니다.');clearCoachUpload();};
  reader.onload=()=>{
    const image=new Image();
    image.onerror=()=>{alert('이미지 형식을 확인해 주세요.');clearCoachUpload();};
    image.onload=()=>{
      const canvas=document.createElement('canvas');
      const maxSide=1200,scale=Math.min(1,maxSide/Math.max(image.width,image.height));
      canvas.width=Math.max(1,Math.round(image.width*scale));
      canvas.height=Math.max(1,Math.round(image.height*scale));
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(image,0,0,canvas.width,canvas.height);
      let quality=.82,uri=canvas.toDataURL('image/jpeg',quality);
      while(uri.length>220000 && quality>.42){quality-=.1;uri=canvas.toDataURL('image/jpeg',quality);}
      coachUploadImage=uri;
      const preview=document.getElementById('coachUploadImage'),box=document.getElementById('coachUploadPreview');
      if(preview)preview.src=uri;if(box)box.style.display='block';
    };
    image.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function showFullCoachImage(uri){
  if(!uri || !uri.startsWith('data:image/'))return;
  const existing=document.getElementById('coachFullView');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.id='coachFullView';overlay.className='coach-fullscreen';
  const close=document.createElement('button');close.textContent='✕ 돌아가기';close.onclick=()=>overlay.remove();
  const heading=document.createElement('h2');heading.textContent='🌱 다음에는 이렇게 해요!';
  const image=document.createElement('img');image.src=uri;image.alt='크게 보는 행동 지도 그림';
  overlay.append(close,heading,image);
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}

function history(){let i=chartSelected,s=db.students[i],weeks=Object.keys(db.weeks).sort().filter(w=>db.weeks[w][s.id]);return `<section class="panel"><h2>📈 학생별 성장 기록 · 상담 자료</h2><div class="row">${db.students.map((x,j)=>`<button class="${i===j?'active':''}" onclick="chartSelected=${j};render()">${esc(x.name)}</button>`).join('')}</div><p class="hint">점수 외에도 그 주의 약속과 칭찬·대체 행동을 함께 확인하세요. 서로 다른 약속을 수행한 점수를 단순 비교하지 않도록 주의해 주세요.</p></section><div class="panel"><h2>${esc(s.name)}의 주간 총점</h2>${weeks.length?`<div class="chartbox">${weeks.slice(-12).map(w=>{let r=db.weeks[w][s.id],v=total(r);return `<div class="colouter"><strong>${v}</strong><div class="chartcol" style="height:${Math.min(100,Math.round(v/35*100))}px"></div><small>${esc(w.slice(5))}</small></div>`}).join('')}</div>`:'<p class="hint">아직 주간 점수 기록이 없습니다.</p>'}<div class="records" style="margin-top:20px">${weeks.slice().reverse().map(w=>{let r=db.weeks[w][s.id];return `<div class="record"><b>${esc(w)} · ${total(r)}점</b><p>약속: ${esc(r.promise)}</p><p>🌟 칭찬: ${esc(r.positive||'기록 없음')}</p><p>🌱 다음 행동: ${esc(r.next||r.practice||'기록 없음')}</p></div>`}).join('')}</div><button onclick="window.print()">🖨️ 현재 화면 인쇄(브라우저 인쇄)</button></div>`}

function paper(s,i){let r=record(i);if(printType==='poster')return `<article class="poster"><h1>☀️ ${esc(s.name)}의 약속</h1><div class="posterprom">${esc(r.promise)}</div><img src="${studentPoster(s)}"><div class="day-row">${DAYS.map(d=>`<div class="day"><b>${d}</b><p style="border:1px solid #ccc;height:36px;background:white;border-radius:6px"></p></div>`).join('')}</div><p style="text-align:center;font-size:22px">이번 주 총점: _______ 점</p></article>`;if(printType==='result')return `<article class="paperpage"><div class="printhead">☀️ ${esc(s.name)}의 주간 약속 돌아보기</div><p>${esc(week)} · ${esc(r.promise)}</p><div class="day-row">${r.scores.map((x,j)=>`<div class="day">${DAYS[j]}<strong>${x===null?'–':x}</strong>${r.plus[j]?`+${r.plus[j]}`:''}</div>`).join('')}</div><h2>이번 주 총점: ${total(r)}점</h2><div class="positive"><h2>🌟 잘한 행동</h2><p>${esc(r.positive)}</p></div><div class="practice" style="margin-top:15px"><h2>🌱 다음 행동</h2><p>${esc(r.practice||r.next)}</p></div><p>다음 주 도전: ${esc(r.next)}</p></article>`;let weeks=Object.keys(db.weeks).sort().filter(w=>db.weeks[w][s.id]);return `<article class="paperpage"><div class="printhead">${esc(s.name)} · 약속 성장 관찰 기록</div><p>인쇄일: ${new Date().toLocaleDateString('ko-KR')}</p>${weeks.map(w=>{let x=db.weeks[w][s.id];return `<div class="bullet"><b>${esc(w)} · ${total(x)}점</b><p>약속: ${esc(x.promise)}</p><p>잘한 행동: ${esc(x.positive)}</p><p>연습·대체 행동: ${esc(x.practice)}</p><p>다음 목표: ${esc(x.next)}</p></div>`}).join('')}</article>`}
function settings(){return `<section class="panel"><h2>⚙️ 데이터 백업과 운영 설정</h2><div class="safe">기본 기록은 이 브라우저의 로컬 저장소에 저장됩니다. 서버로 전송되지 않지만 브라우저 데이터 삭제·다른 PC 사용 시 사라질 수 있습니다. 정기적으로 JSON 백업 파일을 저장해 주세요.</div><div class="row" style="margin:18px 0"><button class="primary" onclick="exportJSON()">⬇ 기록 전체 백업(JSON)</button><label class="choice">⬆ 백업 복원 <input type="file" accept="application/json,.json" onchange="importJSON(this.files[0])"></label></div><h2>학생 이름과 발표 참석 여부</h2>${db.students.map((s,i)=>`<div class="row" style="margin:8px 0"><input style="max-width:180px" aria-label="${esc(s.name)} 이름" value="${esc(s.name)}" onchange="renameStudent(${i},this.value)"><label><input type="checkbox" style="width:auto" ${db.attendance[i]?'checked':''} onchange="toggleAttend(${i},this.checked)"> 금요일 발표 참여</label></div>`).join('')}<hr class="separator"><h2>개인정보와 사용 안내</h2><p class="hint">교실 공용 PC 사용을 피하고, 행동 기록을 다른 학생이나 외부에 공유하지 마세요. 현재 앱에는 사용자 로그인·서버 동기화 기능이 없습니다. AI로 자동 생성하는 그림이나 문장은 포함되지 않았으며, 행동 지도 카드를 직접 만드는 오프라인 방식입니다.</p><button onclick="if(confirm('모든 학생 점수와 배지 기록을 삭제하고 초기 상태로 되돌릴까요? 백업 후 진행하세요.')){db=base();save();render()}">⚠ 전체 데이터 초기화</button></section>`}
function renameStudent(i,v){v=v.trim();if(v){db.students[i].name=v;save();render()}}function exportJSON(){const blob=new Blob([JSON.stringify({format:'haeoreum_v1',saved:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='해오름반_약속기록_'+week+'.json';a.click();URL.revokeObjectURL(u)}function importJSON(file){if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let val=JSON.parse(rd.result);if(val.format!=='haeoreum_v1'||!Array.isArray(val.data?.students)||!val.data.weeks){throw Error('형식이 올바르지 않습니다')}if(!confirm('현재 기록을 백업 파일의 내용으로 대체할까요?'))return;db=val.data;save();render();toast('기록을 복원했습니다.')}catch(e){alert('백업 파일을 읽을 수 없습니다: '+e.message)}};rd.readAsText(file)}

const priorRender=render, priorEdit=edit, priorCoach=coach, priorHome=home;
let storageDB=null, writeQueue=Promise.resolve(), savedState='기록 불러오는 중', reviewStage=0, storyIndex=0, pendingImages=[];
function storageLabel(message){savedState=message;let el=document.getElementById('storage-state');if(el)el.textContent=message;}
function txStore(method,value){return new Promise((resolve,reject)=>{const t=storageDB.transaction('records',method==='get'?'readonly':'readwrite');const q=method==='get'?t.objectStore('records').get(KEY):t.objectStore('records').put(value,KEY);t.oncomplete=()=>resolve(q.result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);});}
function save(){db.savedAt=Date.now();const snapshot=JSON.stringify(db);let local=false;try{localStorage.setItem(KEY,snapshot);local=true}catch(e){} if(storageDB){storageLabel('저장 중…');writeQueue=writeQueue.catch(()=>{}).then(()=>txStore('put',snapshot)).then(()=>storageLabel('✓ 이 기기에 저장 완료'),()=>storageLabel(local?'✓ 기본 저장 완료':'⚠ 저장 실패 · 백업 필요'));return true;}storageLabel(local?'✓ 이 기기에 저장 완료':'⚠ 저장 실패 · 백업 필요');return local;}
async function boot(){try{storageDB=await new Promise((resolve,reject)=>{const q=indexedDB.open('haeoreum_records_v2',1);q.onupgradeneeded=()=>q.result.createObjectStore('records');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});const old=await txStore('get');if(old){const parsed=JSON.parse(old);if(parsed.students&&parsed.weeks && (parsed.savedAt||0)>=(db.savedAt||0))db=parsed;else await txStore('put',JSON.stringify(db));}else await txStore('put',JSON.stringify(db));storageLabel('✓ 이 기기에 저장 완료');}catch(e){storageLabel('기본 브라우저 저장 사용 중');}render();}
home=function(){return priorHome()+`<section class="panel"><h2>지난 주 점수 (${lastWeek()})</h2><div class="grid3">${db.students.map(s=>`<div class="bullet"><b>${esc(s.name)}</b> · <strong>${weekTotal(db.weeks[lastWeek()]?.[s.id])}</strong></div>`).join('')}</div></section>`;};
function lastWeek(){const d=new Date(week+'T12:00:00');d.setDate(d.getDate()-7);return monday(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`)}
function lines(v){return String(v||'').split(/\n/).map(x=>x.trim()).filter(Boolean);}
function listHTML(v,empty){const a=lines(v);return a.length?`<ul class="action-list">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p class="muted">${empty}</p>`;}
function weekTotal(r){return !r||!r.scores.some(x=>x!==null)?'미기록':total(r)+'점';}
function storyImages(r){return Array.isArray(r.storyImages)&&r.storyImages.length?r.storyImages:(r.practiceImage?[r.practiceImage]:[]);}
function studentPoster(s){return validImage(s.poster)?s.poster:IMGS[Number(s.img)||0]||IMGS[0];}
async function attachPoster(i,file){if(!file)return;try{const uri=await imageData(file);db.students[i].poster=uri;save();render();}catch(e){alert('이미지를 첨부하지 못했습니다.');}}
function validImage(x){return typeof x==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x);}
render=function(){priorRender();document.body.classList.toggle('review-mode',mode==='present');const el=document.getElementById('storage-state');if(el)el.textContent=savedState;}
edit=function(){let html=priorEdit();html=html.replace('이번 주 빛나는 행동','잘한 행동 (한 줄에 하나씩)').replace('더 연습할 행동(선택)','앞으로 연습할 행동 (한 줄에 하나씩)').replace(/<button class="gold" onclick="selectedBadgeStudent=.*?<\/button>/,'');return html+`<section class="panel"><h2>📖 이번 주 발표용 사회성 이야기</h2><p class="hint">여러 장을 첨부하고 순서를 바꿀 수 있습니다. 학생별·주차별로 저장됩니다.</p><input type="file" accept="image/png,image/jpeg,image/webp" multiple onchange="attachStories(this.files)"><div class="story-thumbs">${storyImages(record(selected)).filter(validImage).map((img,j)=>`<div><img src="${img}" alt="지도 그림 ${j+1}"><div class="row"><button onclick="moveStory(${j},-1)">←</button><button onclick="moveStory(${j},1)">→</button><button onclick="deleteStory(${j})">삭제</button></div></div>`).join('')}</div><label class="label">자기평가 질문 (한 줄에 하나씩, 비워 두면 약속을 사용)</label><textarea oninput="updateField('selfQuestions',this.value)">${esc(record(selected).selfQuestions||'')}</textarea><label class="label">함께 생각할 퀴즈 (선택)</label><input placeholder="예: 친구가 이야기하고 있어요. 어떻게 할까요?" value="${esc(record(selected).quiz||'')}" oninput="updateField('quiz',this.value)"><input placeholder="바람직한 행동" value="${esc(record(selected).quizGood||'')}" oninput="updateField('quizGood',this.value)"><input placeholder="다른 행동 선택지" value="${esc(record(selected).quizOther||'')}" oninput="updateField('quizOther',this.value)"></section>`;}
function imageData(file){return new Promise((resolve,reject)=>{if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>20*1024*1024)return reject(Error('지원하지 않는 이미지 또는 20MB 초과'));const rd=new FileReader();rd.onerror=reject;rd.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.84));};im.src=rd.result;};rd.readAsDataURL(file);});}
async function attachStories(files){const r=record(selected);try{const images=await Promise.all([...files].map(imageData));r.storyImages=[...storyImages(r),...images];save();render();}catch(e){alert('그림을 읽지 못했습니다. JPG, PNG, WEBP 파일을 확인하세요.');}}
function moveStory(i,d){const r=record(selected),a=[...storyImages(r)],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];r.storyImages=a;save();render();}

function present(){if(!presentPeople.length)presentPeople=db.students.map((_,i)=>i).filter(i=>db.attendance[i]);if(!presentPeople.length)return '<section class="panel">발표 학생을 선택하세요.</section>';const i=presentPeople[presentIdx],s=db.students[i],r=record(i),prev=db.weeks[lastWeek()]?.[s.id],imgs=storyImages(r).filter(validImage),questions=lines(r.selfQuestions||r.promise),names=['약속·스스로 체크','점수·잘한 행동','연습·사회성 이야기','다음 주 다짐'];let content='';if(reviewStage===0){content=`<div class="review-grid"><img class="review-poster" src="${studentPoster(s)}" alt="약속 그림"><div><h2 class="review-text">${esc(r.promise)}</h2><p class="review-text">${esc(r.how)}</p>${questions.map((q,j)=>`<div class="self-row"><b>${esc(q)}</b><div class="row">${['😊 잘했어요','🙂 가끔 했어요','🌱 연습할래요'].map((v,k)=>`<button class="${r.selfAnswers?.[j]===k?'active':''}" onclick="selfCheck(${i},${j},${k})">${v}</button>`).join('')}</div></div>`).join('')}</div></div>`;}else if(reviewStage===1){content=`<div class="review-totals"><div><span>지난 주</span><strong>${weekTotal(prev)}</strong></div><div class="current-total"><span>이번 주</span><strong>${weekTotal(r)}</strong></div></div><div class="day-row review-days">${r.scores.map((v,j)=>`<div class="day"><b>${DAYS[j]}</b><strong>${v===null?'–':v}${r.plus[j]?`<sup>+${r.plus[j]}</sup>`:''}</strong><small>지난 주 ${prev?.scores[j]??'–'}${prev?.plus[j]?`+${prev.plus[j]}`:''}</small></div>`).join('')}</div><div class="positive review-card"><h2>👍 내가 잘한 행동</h2>${listHTML(r.positive,'함께 잘한 행동을 찾아봐요!')}</div>`;}else if(reviewStage===2){let idx=Math.min(storyIndex,Math.max(0,imgs.length-1));content=`<div class="practice review-card"><h2>🌱 앞으로 연습할 행동</h2>${listHTML(r.practice,'이번 주의 좋은 행동을 계속 실천해요!')}</div>${imgs.length?`<div class="story-view"><img src="${imgs[idx]}" onclick="showFullCoachImage(this.src)" alt="사회성 이야기 ${idx+1}"><div class="row between"><button onclick="storyIndex=Math.max(0,storyIndex-1);render()">◀ 이전 그림</button><b>${idx+1} / ${imgs.length}</b><button onclick="showFullCoachImage(document.querySelector('.story-view img').src)">전체 화면</button><button onclick="storyIndex=Math.min(${imgs.length-1},storyIndex+1);render()">다음 그림 ▶</button></div></div>`:''}${r.quiz&&r.quizGood&&r.quizOther?`<div class="review-card"><h2>함께 생각해요</h2><p>${esc(r.quiz)}</p><div class="row"><button onclick="toast('다른 방법도 생각해 봐요!')">${esc(r.quizOther)}</button><button onclick="toast('좋아요! 이렇게 실천해요.')">${esc(r.quizGood)}</button></div></div>`:''}`;}else{const choices=lines(r.practice||r.next||r.how);content=`<div class="review-card positive"><h2>지난 주 다짐</h2><p>${esc(prev?.chosenGoal||prev?.next||'기록 없음')}</p><div class="row"><button class="${r.lastGoalCheck===1?'active':''}" onclick="goalCheck(${i},1)">😊 실천했어요</button><button class="${r.lastGoalCheck===2?'active':''}" onclick="goalCheck(${i},2)">🌱 더 연습해요</button></div></div><div class="review-card"><h2>다음 주에 내가 실천할 행동은?</h2>${choices.map(x=>`<button class="goal-choice ${r.chosenGoal===x?'active':''}" onclick="chooseGoal(${i},${esc(JSON.stringify(x))})">${esc(x)}</button>`).join('')}</div>`;}return `<section class="panel present review"><div class="focusnav"><button onclick="tab('home')">✕ 발표 종료</button><b>${presentIdx+1} / ${presentPeople.length}명</b><button onclick="tryFullscreen()">전체 화면</button></div><h1>${esc(s.name)}의 약속 돌아보기</h1><div class="review-steps">${names.map((n,j)=>`<button class="${reviewStage===j?'active':''}" onclick="reviewStage=${j};storyIndex=0;render()">${j+1}. ${n}</button>`).join('')}</div>${content}<div class="focusnav"><button onclick="reviewBack()">◀ 이전</button><button class="primary" onclick="reviewNext()">${reviewStage===3?'다음 친구':'다음 단계'} ▶</button></div></section>`;}
function selfCheck(i,j,k){const r=record(i);r.selfAnswers??={};r.selfAnswers[j]=k;save();render();}function goalCheck(i,k){record(i).lastGoalCheck=k;save();render();}function chooseGoal(i,v){record(i).chosenGoal=v;save();render();}function reviewBack(){if(reviewStage>0)reviewStage--;else if(presentIdx>0){presentIdx--;reviewStage=3;}storyIndex=0;render();}function reviewNext(){if(reviewStage<3)reviewStage++;else{reviewStage=0;presentIdx++;if(presentIdx>=presentPeople.length){presentPeople=[];presentIdx=0;tab('finish');return;}}storyIndex=0;render();window.scrollTo(0,0);}
const startReview=startPresent;startPresent=function(){reviewStage=0;storyIndex=0;startReview();};
document.querySelector('[data-tab="badges"]').style.display='none';
document.querySelector('.header').insertAdjacentHTML('beforeend','<div id="storage-state" role="status" style="font-weight:800;color:#207a55"></div>');

const firebaseConfig={apiKey:'AIzaSyBork4W01flbfOEwcssR0AyITq_yAnAvuo',authDomain:'haeoreum-classroom.firebaseapp.com',projectId:'haeoreum-classroom',storageBucket:'haeoreum-classroom.firebasestorage.app',messagingSenderId:'501560860183',appId:'1:501560860183:web:97fb61bc72e42a52eb4652'};
const localSave=save, oldSettings=settings, oldBoot=boot;
let cloudAuth=null, cloudStore=null, cloudUser=null, cloudRevision=null, cloudReady=false, cloudBusy=false, cloudDirty=false, cloudTimer=null, cloudStatus='로그인 전 · 이 기기에만 저장', cloudInitPromise=null;
function cloudMessage(t){cloudStatus=t;const e=document.getElementById('cloud-status');if(e)e.textContent=t;const h=document.getElementById('cloud-header');if(h)h.textContent=t;}
function cloudPanel(){return `<section class="panel"><h2>☁️ 학교·집 기록 동기화</h2><p id="cloud-status" role="status">${esc(cloudStatus)}</p><p class="hint">같은 Google 계정으로 로그인하세요. 첫 연결 시 기존 기록을 백업한 후 가져오기 또는 올리기를 선택하세요. 동시에 두 기기에서 편집하지 마세요.</p><div class="row"><button class="primary" onclick="cloudLogin()">Google 로그인</button><button onclick="cloudPull()">클라우드 기록 가져오기</button><button class="green" onclick="cloudPush(true)">현재 기록 저장 / 동기화 시작</button><button onclick="cloudLogout()">로그아웃</button></div></section>`;}
settings=function(){return cloudPanel()+oldSettings().replace('서버로 전송되지 않지만','Firebase 연결 전에는 서버로 전송되지 않으며').replace('현재 앱에는 사용자 로그인·서버 동기화 기능이 없습니다.','Google 로그인 후 계정별 클라우드 저장을 사용할 수 있습니다.')+`<section class="panel"><h2>학생별 약속판 그림 등록</h2><p class="hint">개별 그림은 공개 파일에 포함하지 않고 로그인 계정의 데이터에 저장합니다.</p>${db.students.map((s,i)=>`<div class="row"><img class="portrait" src="${studentPoster(s)}"><b>${esc(s.name)}</b><input type="file" accept="image/png,image/jpeg,image/webp" onchange="attachPoster(${i},this.files[0])"></div>`).join('')}</section>`;};
document.querySelector('.header').insertAdjacentHTML('beforeend','<button id="cloud-header" onclick="tab(\'settings\')">로그인 전 · 이 기기에만 저장</button>');
function loadSDK(){if(window.firebase)return Promise.resolve();return ['app','auth','firestore'].reduce((p,n)=>p.then(()=>new Promise((resolve,reject)=>{const el=document.createElement('script');el.src='https://www.gstatic.com/firebasejs/10.12.5/firebase-'+n+'-compat.js';el.onload=resolve;el.onerror=()=>reject(Error('Firebase SDK를 불러오지 못했습니다.'));document.head.appendChild(el);})),Promise.resolve());}
function cloudInit(){if(cloudInitPromise)return cloudInitPromise;cloudInitPromise=loadSDK().then(()=>{const app=firebase.initializeApp(firebaseConfig,'haeoreum');cloudAuth=app.auth();cloudStore=app.firestore();cloudAuth.onAuthStateChanged(async user=>{clearTimeout(cloudTimer);cloudUser=user;cloudReady=false;cloudRevision=null;cloudDirty=false;if(!user){cloudMessage('로그인 전 · 이 기기에만 저장');return;}cloudMessage('로그인됨 · 클라우드 기록 확인 중');try{const m=await manifest().get({source:'server'});if(cloudUser?.uid!==user.uid)return;cloudRevision=m.exists?m.data().rev:null;const marker=localStorage.getItem('haeoreum_synced_'+user.uid);if(m.exists&&((marker&&marker===await hashText(JSON.stringify(db)))||isPristine())){await cloudPull(true);return;}cloudMessage(m.exists?'로그인됨 · 기존 클라우드 기록을 가져오세요':'로그인됨 · 최초 기록 저장을 눌러 시작하세요');}catch(e){cloudMessage('클라우드 확인 실패: '+e.message);}});}).catch(e=>{cloudInitPromise=null;cloudMessage('연결 실패: '+e.message);throw e;});return cloudInitPromise;}
function isPristine(){return db.students.every((s,i)=>s.name==='학생 '+(i+1)&&!s.poster)&&!db.cards.length&&!db.badges.length&&Object.values(db.weeks).every(w=>Object.values(w).every(r=>!r.scores.some(x=>x!==null)&&!r.positive&&!r.practice&&!r.next&&!r.storyImages?.length&&!r.notes?.some(Boolean)&&r.promise==='이번 주 약속을 정해요'));}
function manifest(){return cloudStore.collection('teacher_data').doc(cloudUser.uid).collection('classroom').doc('manifest');}
function chunkRef(id){return manifest().collection('chunks').doc(id);}
async function cloudLogin(){try{await cloudInit();await cloudAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}catch(e){alert('로그인 실패: '+e.message);}}
async function cloudLogout(){if(cloudBusy){alert('동기화가 끝난 후 로그아웃하세요.');return;}if(cloudDirty&&!confirm('클라우드에 저장되지 않은 변경이 있습니다. 기기 기록은 남습니다. 로그아웃할까요?'))return;clearTimeout(cloudTimer);if(cloudAuth)await cloudAuth.signOut();}
function validateCloud(x){return !!x&&Array.isArray(x.students)&&x.students.length===7&&x.weeks&&Array.isArray(x.cards)&&Array.isArray(x.badges)&&Array.isArray(x.attendance);}
async function cloudPull(automatic=false){if(!cloudUser){alert('먼저 Google 로그인하세요.');return;}if(cloudBusy)return;if(!automatic&&!confirm('클라우드 기록을 이 기기에 적용할까요? 현재 기록은 백업 후 진행하세요.'))return;const before=JSON.stringify(db);cloudBusy=true;clearTimeout(cloudTimer);cloudReady=false;const uid=cloudUser.uid;try{const m=await manifest().get({source:'server'});if(!m.exists){alert('클라우드 기록이 없습니다. 현재 기록을 저장하세요.');return;}const data=m.data();if(!Array.isArray(data.chunks)||data.chunks.length>10000)throw Error('기록 형식 오류');let parts=[];for(let i=0;i<data.chunks.length;i+=20){const rows=await Promise.all(data.chunks.slice(i,i+20).map(id=>chunkRef(id).get({source:'server'})));parts.push(...rows.map(x=>{if(!x.exists)throw Error('기록 일부가 없습니다.');return x.data().text;}));}const parsed=JSON.parse(parts.join(''));if(!validateCloud(parsed)||cloudUser?.uid!==uid)throw Error('기록 확인 실패');if(JSON.stringify(db)!==before)throw Error('불러오는 동안 기록이 변경되었습니다. 다시 시도하세요.');db=parsed;localSave();try{localStorage.setItem('haeoreum_synced_'+uid,await hashText(JSON.stringify(db)));}catch(e){}cloudRevision=data.rev;cloudDirty=false;cloudReady=true;render();cloudMessage('✓ 클라우드 기록 불러옴 · 자동 저장 활성');}catch(e){cloudMessage('가져오기 실패 · 기존 기록 유지');alert(e.message);}finally{cloudBusy=false;}}
async function hashText(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function cloudPush(manual=false){if(!cloudUser){if(manual)alert('먼저 Google 로그인하세요.');return;}if(cloudBusy)return;if(!manual&&!cloudReady)return;if(manual&&!cloudReady&&cloudRevision!==null){alert('기존 클라우드 기록을 먼저 가져오세요.');return;}if(manual&&!cloudReady&&!confirm('현재 기기 기록을 클라우드에 저장할까요? 기존 클라우드 기록이 있다면 먼저 가져오기를 권장합니다.'))return;clearTimeout(cloudTimer);cloudBusy=true;const uid=cloudUser.uid, expected=cloudRevision,snapshot=JSON.stringify(db),ref=manifest();cloudMessage('☁️ 클라우드 저장 중…');try{const current=await ref.get({source:'server'});if((current.exists?current.data().rev:null)!==expected)throw Error('다른 기기의 기록이 변경되었습니다. 백업 후 클라우드 기록을 가져오세요.');const chunks=[];for(let i=0;i<snapshot.length;){let end=Math.min(i+180000,snapshot.length);if(end<snapshot.length&&/[\uD800-\uDBFF]/.test(snapshot[end-1]))end--;const part=snapshot.slice(i,end),id=await hashText(part);chunks.push(id);if(!current.data()?.chunks?.includes(id)){const cr=chunkRef(id),existing=await cr.get({source:'server'});if(!existing.exists)await cr.set({text:part});}i=end;}const rev=uid+'-'+Date.now()+'-'+Math.random().toString(36).slice(2);await cloudStore.runTransaction(async t=>{const old=await t.get(ref);if((old.exists?old.data().rev:null)!==expected)throw Error('다른 기기에서 저장했습니다. 백업 후 가져오세요.');t.set(ref,{rev,chunks,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});});if(cloudUser?.uid!==uid)return;cloudRevision=rev;cloudReady=true;try{localStorage.setItem('haeoreum_synced_'+uid,await hashText(snapshot));}catch(e){}cloudDirty=JSON.stringify(db)!==snapshot;cloudMessage(cloudDirty?'변경 사항 저장 대기 중':'✓ 클라우드 저장 완료');}catch(e){cloudReady=false;cloudDirty=true;cloudMessage('⚠ 동기화 중단 · 기기 기록 유지: '+e.message);if(manual)alert(e.message);}finally{cloudBusy=false;if(cloudReady&&cloudDirty)cloudTimer=setTimeout(()=>cloudPush(),2500);}}
save=function(){const ok=localSave();if(cloudReady&&cloudUser){cloudDirty=true;cloudMessage('☁️ 변경 사항 저장 대기 중');clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudPush(),2500);}return ok;};
boot=async function(){await oldBoot();cloudInit().catch(()=>{});};

boot();
