function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('저장 공간이 부족합니다. 설정에서 백업을 내려받아 주세요.');return false}}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}function record(i,w=week){db.weeks[w]??={};db.weeks[w][db.students[i].id]??={scores:[null,null,null,null,null],plus:[0,0,0,0,0],notes:['','','','',''],positive:'',practice:'',next:'',promise:db.students[i].promise,how:db.students[i].how,icon:db.students[i].icon,positiveIcon:'🌟',practiceIcon:'💡'};return db.weeks[w][db.students[i].id]};function weekDates(){let d=new Date(week+'T12:00:00');return DAYS.map((a,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return `${a} ${x.getMonth()+1}/${x.getDate()}`})}function total(r){return r.scores.reduce((n,x,i)=>n+(x===null?0:Number(x)+Number(r.plus[i]||0)),0)}function getBadges(i){return db.badges.filter(b=>b.sid===db.students[i].id)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function moveWeek(n){let d=new Date(week+'T12:00:00');d.setDate(d.getDate()+7*n);week=monday(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);render()}function prevWeek(){moveWeek(-1)}function nextWeek(){moveWeek(1)}function tab(t){mode=t;render();window.scrollTo({top:0,behavior:'instant'})}function switchStudent(i){selected=i;coachUploadImage=null;render()}function render(){document.getElementById('week').value=week;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===mode));document.getElementById('app').innerHTML=({home:home,edit:edit,coach:coach,present:present,badges:badges,history:history,print:printView,settings:settings})[mode]();}

function coach(){let s=db.students[selected];return `<section class="panel"><h2>💡 행동 지도 카드 만들기</h2><p class="warning"><b>안내:</b> 이 오프라인 버전은 AI에 연결되어 있지 않습니다. 교사의 입력에 따라 쉬운 문장을 직접 작성하고, 준비된 대체 행동 예시를 선택해 2컷 카드로 보여줍니다. 새로운 상황의 AI 자동 그림 생성은 지원하지 않습니다.</p><div class="row">${db.students.map((x,i)=>`<button class="${selected===i?'active':''}" onclick="switchStudent(${i})">${esc(x.name)}</button>`).join('')}</div></section><div class="grid"><section class="panel"><h2>📝 ${esc(s.name)} 지도 내용</h2><label class="label">관찰한 상황</label><textarea id="situation" placeholder="예: 친구가 먼저 이야기하는데 중간에 끼어들었어요."></textarea><label class="label">다음에 실천할 대체 행동</label><textarea id="alternative" placeholder="예: 친구 말이 끝나면 내 차례에 이야기해요."></textarea><label class="label">쉽게 설명하는 한마디</label><input id="coachLine" placeholder="예: 차례를 기다리면 서로 이야기하기 좋아요."><input type="hidden" id="coachIcon" value="💡"><div class="coach-upload" style="margin-top:17px"><label class="label" for="coachUpload">🖼️ 선생님이 만든 지도 그림 첨부</label><p class="hint">JPG, PNG, WEBP 이미지를 선택하세요. 가로·세로 비율을 유지해 자동으로 크기를 줄이고 이 브라우저에 저장합니다.</p><input id="coachUpload" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewCoachUpload(this.files[0])"><div id="coachUploadPreview" class="coach-preview"><img id="coachUploadImage" class="coach-img" alt="첨부할 지도 그림 미리보기"><div class="row" style="margin-top:8px;justify-content:center"><button onclick="clearCoachUpload()">그림 선택 취소</button></div></div></div><p class="label">자주 사용하는 예시</p>${suggestions.map((x,j)=>`<button style="margin:3px" onclick="fillCoach(${j})">${esc(x[1])}</button>`).join('')}<div class="row" style="margin-top:16px"><button class="green" onclick="createCard()">✔ 지도 카드 저장</button></div></section><section class="panel"><h2>🖼️ 저장한 2컷 지도 카드</h2>${db.cards.filter(c=>c.sid===s.id).slice().reverse().map(c=>`<div class="bullet"><div class="row between"><b>${esc(c.date)} · ${esc(c.alt)}</b><button onclick="removeCard('${c.id}')">삭제</button></div>${c.image?`<img class="coach-img" loading="lazy" src="${c.image}" alt="${esc(s.name)}의 행동 지도 그림">`:''}<div class="grid"><div class="practice center"><b>어떤 일이 있었나요?</b><p>${esc(c.situation)}</p></div><div class="positive center"><b>다음에는 이렇게 해요!</b><p>${esc(c.alt)}</p></div></div><p class="hint">${esc(c.line)}</p>${c.image?`<button class="primary" onclick="openCoachImage('${c.id}')">🔎 그림 크게 보여주기</button> `:''}<button onclick="useCard('${c.id}',false)">이번 주에 적용</button> <button class="gold" onclick="useCard('${c.id}',true)">다음 주에 적용</button></div>`).join('')||'<p class="hint">아직 카드가 없습니다. 왼쪽에서 하나 만들어 보세요.</p>'}</section></div>`}

let coachUploadImage=null;
function clearCoachUpload(){
  coachUploadImage=null;
  const input=document.getElementById('coachUpload');if(input)input.value='';
  const box=document.getElementById('coachUploadPreview');if(box)box.style.display='none';
}
function previewCoachUpload(file){
  if(!file)return;
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){alert('JPG, PNG, WEBP 이미지만 첨부할 수 있습니다.');clearCoachUpload();return;}
  if(file.size>20*1024*1024){alert('20MB 이하 이미지를 선택해 주세요.');clearCoachUpload();return;}
  const reader=new FileReader();
  reader.onerror=()=>{alert('이미지를 읽을 수 없습니다.');clearCoachUpload();};
  reader.onload=()=>{
    const image=new Image();
    image.onerror=()=>{alert('이미지 형식을 확인해 주세요.');clearCoachUpload();};
    image.onload=()=>{
      const canvas=document.createElement('canvas');
      const maxSide=1200,scale=Math.min(1,maxSide/Math.max(image.width,image.height));
      canvas.width=Math.max(1,Math.round(image.width*scale));
      canvas.height=Math.max(1,Math.round(image.height*scale));
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(image,0,0,canvas.width,canvas.height);
      let quality=.82,uri=canvas.toDataURL('image/jpeg',quality);
      while(uri.length>220000 && quality>.42){quality-=.1;uri=canvas.toDataURL('image/jpeg',quality);}
      coachUploadImage=uri;
      const preview=document.getElementById('coachUploadImage'),box=document.getElementById('coachUploadPreview');
      if(preview)preview.src=uri;if(box)box.style.display='block';
    };
    image.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function showFullCoachImage(uri){
  if(!uri || !uri.startsWith('data:image/'))return;
  const existing=document.getElementById('coachFullView');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.id='coachFullView';overlay.className='coach-fullscreen';
  const close=document.createElement('button');close.textContent='✕ 돌아가기';close.onclick=()=>overlay.remove();
  const heading=document.createElement('h2');heading.textContent='🌱 다음에는 이렇게 해요!';
  const image=document.createElement('img');image.src=uri;image.alt='크게 보는 행동 지도 그림';
  overlay.append(close,heading,image);
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}
function openCoachImage(id){let card=db.cards.find(c=>c.id===id);if(card?.image)showFullCoachImage(card.image);}

function createCard(){let situation=document.getElementById('situation').value.trim(),alt=document.getElementById('alternative').value.trim(),line=document.getElementById('coachLine').value.trim(),icon=document.getElementById('coachIcon').value;if(!alt){alert('대체 행동을 입력해 주세요.');return}db.cards.push({id:uid(),sid:db.students[selected].id,situation,alt,line,icon,image:coachUploadImage,date:new Date().toISOString().slice(0,10)});if(!save()){db.cards.pop();alert('이미지를 저장할 공간이 부족합니다. 더 작은 이미지를 사용하거나 오래된 카드를 정리해 주세요.');return;}coachUploadImage=null;toast('지도 카드를 저장했습니다.');render()}function removeCard(id){if(confirm('카드를 삭제할까요?')){db.cards=db.cards.filter(c=>c.id!==id);save();render()}}function useCard(id,nextWeek){let c=db.cards.find(x=>x.id===id);if(c){let target=week;if(nextWeek){let d=new Date(week+'T12:00:00');d.setDate(d.getDate()+7);target=monday(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()))}let r=record(selected,target);r.practice=c.alt;r.practiceIcon=c.icon;r.practiceImage=c.image||'';r.next=c.alt;save();toast((nextWeek?'다음 주':'이번 주')+' 행동 지도 그림과 내용을 적용했습니다.')}}

lass="actionrow"><div>${esc(r.practiceIcon)}</div><div class="bigtext">${esc(r.practice)}</div></div>${r.practiceImage?`<img class="coach-img" style="max-height:260px;margin-top:10px;cursor:zoom-in" onclick="showFullCoachImage(this.src)" src="${r.practiceImage}" alt="다음 주에 실천할 행동을 설명하는 그림"><button onclick="showFullCoachImage(this.previousElementSibling.src)" class="no-print">🔎 그림 전체 화면</button>`:''}</div>`:''}<div class="bullet" style="font-size:20px;font-weight:900;margin-top:12px">🌱 다음 주 도전: ${esc(r.next||r.how)}</div>${earned.length?`<div class="badgecard celebrate center"><span style="font-size:40px">${badgeTypes.find(x=>x[0]===earned.at(-1).type)?.[1]||'🌟'}</span> <b>이번 주 ${esc(earned.at(-1).type)} 배지 획득!</b><div class="hint">${esc(earned.at(-1).reason)}</div></div>`:''}</div></div><div class="focusnav no-print" style="margin-top:10px"><button onclick="presentIdx=Math.max(0,presentIdx-1);render()" ${presentIdx===0?'disabled':''}>◀ 이전 친구</button><button class="gold" onclick="cheer()">👏 다 같이 칭찬!</button><button class="primary" onclick="presentIdx=presentIdx+1;if(presentIdx>=presentPeople.length){tab('finish')}else{render()}">다음 친구 ▶</button></div></section>`}

function paper(s,i){let r=record(i);if(printType==='poster')return `<article class="poster"><h1>☀️ ${esc(s.name)}의 약속</h1><div class="posterprom">${esc(r.promise)}</div><img src="${studentPoster(s)}"><div class="day-row">${DAYS.map(d=>`<div class="day"><b>${d}</b><p style="border:1px solid #ccc;height:36px;background:white;border-radius:6px"></p></div>`).join('')}</div><p style="text-align:center;font-size:22px">이번 주 총점: _______ 점</p></article>`;if(printType==='result')return `<article class="paperpage"><div class="printhead">☀️ ${esc(s.name)}의 주간 약속 돌아보기</div><p>${esc(week)} · ${esc(r.promise)}</p><div class="day-row">${r.scores.map((x,j)=>`<div class="day">${DAYS[j]}<strong>${x===null?'–':x}</strong>${r.plus[j]?`+${r.plus[j]}`:''}</div>`).join('')}</div><h2>이번 주 총점: ${total(r)}점</h2><div class="positive"><h2>🌟 잘한 행동</h2><p>${esc(r.positive)}</p></div><div class="practice" style="margin-top:15px"><h2>🌱 다음 행동</h2><p>${esc(r.practice||r.next)}</p></div><p>다음 주 도전: ${esc(r.next)}</p></article>`;let weeks=Object.keys(db.weeks).sort().filter(w=>db.weeks[w][s.id]);return `<article class="paperpage"><div class="printhead">${esc(s.name)} · 약속 성장 관찰 기록</div><p>인쇄일: ${new Date().toLocaleDateString('ko-KR')}</p>${weeks.map(w=>{let x=db.weeks[w][s.id];return `<div class="bullet"><b>${esc(w)} · ${total(x)}점</b><p>약속: ${esc(x.promise)}</p><p>잘한 행동: ${esc(x.positive)}</p><p>연습·대체 행동: ${esc(x.practice)}</p><p>다음 목표: ${esc(x.next)}</p></div>`}).join('')}</article>`}
function settings(){return `<section class="panel"><h2>⚙️ 데이터 백업과 운영 설정</h2><div class="safe">기본 기록은 이 브라우저의 로컬 저장소에 저장됩니다. 서버로 전송되지 않지만 브라우저 데이터 삭제·다른 PC 사용 시 사라질 수 있습니다. 정기적으로 JSON 백업 파일을 저장해 주세요.</div><div class="row" style="margin:18px 0"><button class="primary" onclick="exportJSON()">⬇ 기록 전체 백업(JSON)</button><label class="choice">⬆ 백업 복원 <input type="file" accept="application/json,.json" onchange="importJSON(this.files[0])"></label></div><h2>학생 이름과 발표 참석 여부</h2>${db.students.map((s,i)=>`<div class="row" style="margin:8px 0"><input style="max-width:180px" aria-label="${esc(s.name)} 이름" value="${esc(s.name)}" onchange="renameStudent(${i},this.value)"><label><input type="checkbox" style="width:auto" ${db.attendance[i]?'checked':''} onchange="toggleAttend(${i},this.checked)"> 금요일 발표 참여</label></div>`).join('')}<hr class="separator"><h2>개인정보와 사용 안내</h2><p class="hint">교실 공용 PC 사용을 피하고, 행동 기록을 다른 학생이나 외부에 공유하지 마세요. 현재 앱에는 사용자 로그인·서버 동기화 기능이 없습니다. AI로 자동 생성하는 그림이나 문장은 포함되지 않았으며, 행동 지도 카드를 직접 만드는 오프라인 방식입니다.</p><button onclick="if(confirm('모든 학생 점수와 배지 기록을 삭제하고 초기 상태로 되돌릴까요? 백업 후 진행하세요.')){db=base();save();render()}">⚠ 전체 데이터 초기화</button></section>`}
function renameStudent(i,v){v=v.trim();if(v){db.students[i].name=v;save();render()}}function exportJSON(){const blob=new Blob([JSON.stringify({format:'haeoreum_v1',saved:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='해오름반_약속기록_'+week+'.json';a.click();URL.revokeObjectURL(u)}function importJSON(file){if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let val=JSON.parse(rd.result);if(val.format!=='haeoreum_v1'||!Array.isArray(val.data?.students)||!val.data.weeks){throw Error('형식이 올바르지 않습니다')}if(!confirm('현재 기록을 백업 파일의 내용으로 대체할까요?'))return;db=val.data;save();render();toast('기록을 복원했습니다.')}catch(e){alert('백업 파일을 읽을 수 없습니다: '+e.message)}};rd.readAsText(file)}

const priorRender=render, priorEdit=edit, priorCoach=coach, priorHome=home;
let storageDB=null, writeQueue=Promise.resolve(), savedState='기록 불러오는 중', reviewStage=0, storyIndex=0, pendingImages=[];
function storageLabel(message){savedState=message;let el=document.getElementById('storage-state');if(el)el.textContent=message;}
function txStore(method,value){return new Promise((resolve,reject)=>{const t=storageDB.transaction('records',method==='get'?'readonly':'readwrite');const q=method==='get'?t.objectStore('records').get(KEY):t.objectStore('records').put(value,KEY);t.oncomplete=()=>resolve(q.result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);});}
function save(){db.savedAt=Date.now();const snapshot=JSON.stringify(db);let local=false;try{localStorage.setItem(KEY,snapshot);local=true}catch(e){} if(storageDB){storageLabel('저장 중…');writeQueue=writeQueue.catch(()=>{}).then(()=>txStore('put',snapshot)).then(()=>storageLabel('✓ 이 기기에 저장 완료'),()=>storageLabel(local?'✓ 기본 저장 완료':'⚠ 저장 실패 · 백업 필요'));return true;}storageLabel(local?'✓ 이 기기에 저장 완료':'⚠ 저장 실패 · 백업 필요');return local;}
async function boot(){try{storageDB=await new Promise((resolve,reject)=>{const q=indexedDB.open('haeoreum_records_v2',1);q.onupgradeneeded=()=>q.result.createObjectStore('records');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});const old=await txStore('get');if(old){const parsed=JSON.parse(old);if(parsed.students&&parsed.weeks && (parsed.savedAt||0)>=(db.savedAt||0))db=parsed;else await txStore('put',JSON.stringify(db));}else await txStore('put',JSON.stringify(db));storageLabel('✓ 이 기기에 저장 완료');}catch(e){storageLabel('기본 브라우저 저장 사용 중');}render();}
home=function(){return priorHome()+`<section class="panel"><h2>지난 주 점수 (${lastWeek()})</h2><div class="grid3">${db.students.map(s=>`<div class="bullet"><b>${esc(s.name)}</b> · <strong>${weekTotal(db.weeks[lastWeek()]?.[s.id])}</strong></div>`).join('')}</div></section>`;};
function lastWeek(){const d=new Date(week+'T12:00:00');d.setDate(d.getDate()-7);return monday(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`)}
function lines(v){return String(v||'').split(/\n/).map(x=>x.trim()).filter(Boolean);}
function listHTML(v,empty){const a=lines(v);return a.length?`<ul class="action-list">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p class="muted">${empty}</p>`;}
function weekTotal(r){return !r||!r.scores.some(x=>x!==null)?'미기록':total(r)+'점';}
function storyImages(r){return Array.isArray(r.storyImages)&&r.storyImages.length?r.storyImages:(r.practiceImage?[r.practiceImage]:[]);}
function studentPoster(s){return validImage(s.poster)?s.poster:IMGS[Number(s.img)||0]||IMGS[0];}
async function attachPoster(i,file){if(!file)return;try{const uri=await imageData(file);db.students[i].poster=uri;save();render();}catch(e){alert('이미지를 첨부하지 못했습니다.');}}
function validImage(x){return typeof x==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x);}
render=function(){priorRender();document.body.classList.toggle('review-mode',mode==='present');const el=document.getElementById('storage-state');if(el)el.textContent=savedState;}
edit=function(){let html=priorEdit();html=html.replace('이번 주 빛나는 행동','잘한 행동 (한 줄에 하나씩)').replace('더 연습할 행동(선택)','앞으로 연습할 행동 (한 줄에 하나씩)').replace(/<button class="gold" onclick="selectedBadgeStudent=.*?<\/button>/,'');return html+`<section class="panel"><h2>📖 이번 주 발표용 사회성 이야기</h2><p class="hint">여러 장을 첨부하고 순서를 바꿀 수 있습니다. 학생별·주차별로 저장됩니다.</p><input type="file" accept="image/png,image/jpeg,image/webp" multiple onchange="attachStories(this.files)"><div class="story-thumbs">${storyImages(record(selected)).filter(validImage).map((img,j)=>`<div><img src="${img}" alt="지도 그림 ${j+1}"><div class="row"><button onclick="moveStory(${j},-1)">←</button><button onclick="moveStory(${j},1)">→</button><button onclick="deleteStory(${j})">삭제</button></div></div>`).join('')}</div><label class="label">자기평가 질문 (한 줄에 하나씩, 비워 두면 약속을 사용)</label><textarea oninput="updateField('selfQuestions',this.value)">${esc(record(selected).selfQuestions||'')}</textarea><label class="label">함께 생각할 퀴즈 (선택)</label><input placeholder="예: 친구가 이야기하고 있어요. 어떻게 할까요?" value="${esc(record(selected).quiz||'')}" oninput="updateField('quiz',this.value)"><input placeholder="바람직한 행동" value="${esc(record(selected).quizGood||'')}" oninput="updateField('quizGood',this.value)"><input placeholder="다른 행동 선택지" value="${esc(record(selected).quizOther||'')}" oninput="updateField('quizOther',this.value)"></section>`;}
function imageData(file){return new Promise((resolve,reject)=>{if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>20*1024*1024)return reject(Error('지원하지 않는 이미지 또는 20MB 초과'));const rd=new FileReader();rd.onerror=reject;rd.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.84));};im.src=rd.result;};rd.readAsDataURL(file);});}
async function attachStories(files){const r=record(selected);try{const images=await Promise.all([...files].map(imageData));r.storyImages=[...storyImages(r),...images];save();render();}catch(e){alert('그림을 읽지 못했습니다. JPG, PNG, WEBP 파일을 확인하세요.');}}

function v4Pic(r,s){return v4Img(r.goalPoster||s.poster)||`<div class="v4-illustration">☀️<span>나의 약속</span></div>`;}
function v4Answers(value,fn){return `<div class="v4-answers">${v4Labels.map((x,k)=>`<button class="v4-answer ${value===k?'chosen':''}" onclick="${fn.includes('{k}')?fn.replace('{k}',String(k)):fn+'('+k+')'}"><strong>${v4Symbols[k]}</strong><span>${x}</span></button>`).join('')}</div>`;}
function v4SetCurrent(j,key,value){const r=record(selected),s=db.students[selected];r.goals=JSON.parse(JSON.stringify(v4Goals(r,s)));r.goals[j][key]=key==='steps'?lines(value).slice(0,4):value;r.promise=r.goals.map(g=>g.text).join(' / ');r.how=r.goals.flatMap(g=>g.steps||[]).join('\n');save();}
function v4SetDraft(j,key,value){const r=record(selected);r.nextGoals=v4Draft(r);r.nextGoals[j][key]=key==='steps'?lines(value).slice(0,4):value;save();}
async function v4DraftImage(j,k,file){if(!file)return;const sid=selected,w=week;try{const img=await imageData(file),r=record(sid,w);r.nextGoals=v4Draft(r);if(k===-1)r.nextGoals[j].image=img;else{r.nextGoals[j].stepImages??=[];r.nextGoals[j].stepImages[k]=img;}save();render();}catch(e){alert('그림을 등록하지 못했습니다.');}}
function v4DraftEditor(r){return `<section class="panel"><h2>다음 주 목표와 그림 실천 순서</h2><p class="hint">목표 1~2개, 각 단계에 짧은 문장과 그림을 등록하세요. 금요일에 학생이 선택하면 다음 주 기록에 반영됩니다.</p>${v4Draft(r).map((g,j)=>`<div class="v4-editgoal"><h3>목표 ${j+1}</h3><input value="${esc(g.text)}" placeholder="예: 친구가 싫다고 하면 멈춰요" oninput="v4SetDraft(${j},'text',this.value)"><label class="label">대표 그림</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="v4DraftImage(${j},-1,this.files[0])">${v4Img(g.image,'v4-thumb')}<label class="label">실천 순서 (한 줄에 하나씩, 최대 4개)</label><textarea oninput="v4SetDraft(${j},'steps',this.value)">${esc((g.steps||[]).join('\n'))}</textarea><div class="v4-stepuploads">${Array.from({length:4},(_,k)=>`<div><b>${k+1}단계 그림</b>${v4Img(g.stepImages?.[k],'v4-thumb')}<input type="file" accept="image/png,image/jpeg,image/webp" onchange="v4DraftImage(${j},${k},this.files[0])"></div>`).join('')}</div></div>`).join('')}</section>`;}
edit=function(){const r=record(selected),s=db.students[selected];return v4BaseEdit()+`<section class="panel"><h2>이번 주 목표 및 요일별 그림</h2><p class="hint">현재 약속은 그대로 유지되며, 요일의 행동 이유에 그림을 덧붙일 수 있습니다.</p>${v4Goals(r,s).map((g,j)=>`<div><label class="label">이번 주 목표 ${j+1}</label><input value="${esc(g.text)}" onchange="v4SetCurrent(${j},'text',this.value)"><textarea onchange="v4SetCurrent(${j},'steps',this.value)">${esc((g.steps||[]).join('\n'))}</textarea></div>`).join('')}<div class="v4-stepuploads">${DAYS.map((d,j)=>`<div><b>${d}요일 그림</b>${v4Img(r.dayImages?.[j],'v4-thumb')}<input type="file" accept="image/png,image/jpeg,image/webp" onchange="v4DayImage(${j},this.files[0])">${r.dayImages?.[j]?`<button onclick="v4DeleteDayImage(${j})">그림 삭제</button>`:''}</div>`).join('')}</div></section>`+v4DraftEditor(r)+v4DailyTable(selected);};
async function v4DayImage(j,file){if(!file)return;const i=selected,w=week;try{const img=await imageData(file),r=record(i,w);r.dayImages??=[];r.dayImages[j]=img;save();render();}catch(e){alert('그림을 등록하지 못했습니다.');}}

function v4DailyTable(i){const r=record(i),s=db.students[i],goals=v4Goals(r,s);return `<section class="panel"><h2>매일 자기점검</h2><div class="v4-checktable">${goals.map((g,j)=>`<div><strong>${esc(g.text)}</strong><div class="v4-daygrid">${DAYS.map((d,k)=>{const date=v4Date(week,k),v=r.dailyChecks?.[date]?.responses?.[j];return `<div><b>${d}</b><span>${v==null?'–':v4Symbols[v]||'–'}</span><small>${v==null?'미입력':v4Labels[v]||''}</small></div>`;}).join('')}</div></div>`).join('')}</div></section>`;}
function v4Date(w,i){const d=new Date(w+'T12:00:00');d.setDate(d.getDate()+i);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}

function v4Self(k){const {r}=v4Current();r.v4SelfAnswers??={};r.v4SelfAnswers[v4Question]=k;save();render();}

function v4ConfirmGoals(){const {i,r,s}=v4Current(),a=v4Selected(r,s);if(!a.length){toast('먼저 목표를 선택해 주세요.');return false;}const nw=v4Next(week),next=record(i,nw);if(next.goals?.length&&JSON.stringify(next.goals)!==JSON.stringify(a)&&!confirm('다음 주에 이미 설정된 목표가 있습니다. 선택한 목표로 바꿀까요?'))return false;next.goals=JSON.parse(JSON.stringify(a));next.promise=a.map(g=>g.text).join(' / ');next.how=a.flatMap(g=>g.steps||[]).join('\n');next.goalPoster=a[0].image||'';r.chosenGoal=a.map(g=>g.text).join(' / ');r.confirmedNextGoals=JSON.parse(JSON.stringify(a));save();if(cloudReady&&s.tabletUid)v4Publish(i,nw);return true;}
function v4Nav(delta){const {r,s}=v4Current();if(delta>0){if(reviewStage===0&&!v4Reveal){v4Reveal=true;render();return;}if(reviewStage===1&&r.v4SelfAnswers?.[v4Question]==null){toast('자기평가를 선택해 주세요.');return;}if(reviewStage===1&&v4Question<v4QuestionList(r,s).length-1){v4Question++;render();return;}if(reviewStage===4&&!v4ConfirmGoals())return;if(reviewStage===5){const n=v4Selected(r,s).length;if(v4Step<n-1){v4Step++;v4PracticeStep=0;render();return;}}if(reviewStage===6){r.pledgeDone=true;save();reviewStage=0;presentIdx++;if(presentIdx>=presentPeople.length){presentPeople=[];presentIdx=0;tab('finish');return;}}else reviewStage++;}else{if(reviewStage===1&&v4Question>0){v4Question--;render();return;}if(reviewStage===5&&v4Step>0){v4Step--;v4PracticeStep=0;render();return;}if(reviewStage>0)reviewStage--;else if(presentIdx>0){presentIdx--;reviewStage=6;}else return;}v4Reset();render();window.scrollTo(0,0);}
present=function(){if(!presentPeople.length)presentPeople=db.students.map((_,i)=>i).filter(i=>db.attendance[i]);if(!presentPeople.length)return '<section class="panel">발표 학생을 선택하세요.</section>';presentIdx=Math.min(presentIdx,presentPeople.length-1);const {s,r}=v4Current(),prev=db.weeks[lastWeek()]?.[s.id],goals=v4Goals(r,s),q=v4QuestionList(r,s),choices=v4Choices(r),sel=v4Selected(r,s);let body='';
if(reviewStage===0)body=`<h1>이번 주 약속은 무엇이었나요?</h1><div class="v4-speaking">💬 먼저 말해 봐요!</div>${v4Reveal?`<div class="v4-visual">${v4Pic(r,s)}</div><div class="v4-big">${esc(goals.map(g=>g.text).join(' · '))}</div>`:`<div class="v4-recall"><button onclick="v4Recall('alone')">✓ 기억해서 말했어요</button><button onclick="v4Recall('hint')">그림 힌트 보기</button></div>`}`;
if(reviewStage===1)body=`<h1>나의 행동을 돌아봐요</h1><div class="v4-visual small">${v4Img(goals[Math.min(v4Question,goals.length-1)]?.image)||v4AutoPicture(q[v4Question]||r.promise)}</div><div class="v4-big">${esc(q[v4Question]||r.promise)}</div><p class="v4-caption">${v4Question+1} / ${q.length||1}</p>${v4Answers(r.v4SelfAnswers?.[v4Question],'v4Self')}<div class="v4-dailystrip">${DAYS.map((d,k)=>{const v=r.dailyChecks?.[v4Date(week,k)]?.responses?.[Math.min(v4Question,goals.length-1)];return `<span>${d} ${v==null?'–':v4Symbols[v]}</span>`;}).join('')}</div>`;
if(reviewStage===2)body=`<h1>이번 주 나의 점수</h1><div class="v4-total">${weekTotal(r)}</div><div class="v4-daygrid">${r.scores.map((x,j)=>`<div><b>${DAYS[j]}</b><strong>${x==null?'–':x}${r.plus[j]?`<sup>+${r.plus[j]}</sup>`:''}</strong></div>`).join('')}</div><div class="v4-caption">지난 주 ${weekTotal(prev)} · 기본 25점 + 특별 칭찬 점수</div>`;
if(reviewStage===3){const j=v4Day,n=r.notes?.[j],img=r.dayImages?.[j];body=`<h1>왜 이 점수를 받았을까요?</h1><div class="v4-daygrid">${DAYS.map((d,k)=>`<button class="${j===k?'active':''}" onclick="v4Day=${k};render()">${d}<strong>${r.scores[k]??'–'}${r.plus[k]?`+${r.plus[k]}`:''}</strong></button>`).join('')}</div><div class="v4-reason">${v4Img(img)||`<div class="v4-illustration">${r.scores[j]==null?'📅':r.scores[j]>=5?'🌟':'🌱'}</div>`}<div class="v4-big">${esc(n||'이 날의 행동을 함께 이야기해요.')}</div></div><div class="v4-feedback"><div><b>잘한 행동</b>${listHTML(r.positive,'잘한 행동을 함께 찾아요.')}</div><div><b>연습할 행동</b>${listHTML(r.practice,'좋은 행동을 계속해요.')}</div></div>`;}
if(reviewStage===4)body=`<h1>다음 주에 무엇을 연습할까요?</h1><div class="v4-goals">${choices.map((g,j)=>`<button class="v4-goal ${(r.selectedNextGoals||[]).includes(j)?'chosen':''}" onclick="v4GoalToggle(${j})">${v4Img(g.image)||v4AutoPicture(g.text)}<strong>${esc(g.text)}</strong></button>`).join('')}</div>${choices.length?'':`<p class="v4-big">선생님과 목표를 정해요.</p><button onclick="selected=${presentPeople[presentIdx]};tab('edit')">교사 화면에서 목표 등록</button>`}<p class="v4-caption">한두 가지를 골라요.</p>`;
if(reviewStage===5){const g=sel[v4Step];const imgs=storyImages(r).filter(validImage);body=`<h1>어떻게 실천할까요?</h1><div class="v4-big">${esc(g?.text||r.chosenGoal||'나의 약속')}</div>${g?.image?v4Img(g.image,'v4-picture small'):''}<div class="v4-steps">${(g?.steps||[]).map((x,j)=>`<div class="${j<v4PracticeStep?'v4-practiced':''}">${v4Img(g.stepImages?.[j])||v4AutoPicture(x)}<strong>${j+1}. ${esc(x)}</strong><button onclick="if(${j}===v4PracticeStep){v4PracticeStep++;render();}else if(${j}>v4PracticeStep)toast('앞 단계부터 해 봐요.')">${j<v4PracticeStep?'✓ 해 봤어요':'이렇게 해요'}</button></div>`).join('')}</div>${(!g?.steps?.length&&imgs.length)?`<div class="v4-story">${v4Img(imgs[Math.min(v4ImagePage,imgs.length-1)])}<button onclick="v4ImagePage=(v4ImagePage+1)%${imgs.length};render()">다음 그림 (${v4ImagePage+1}/${imgs.length})</button></div>`:''}<p class="v4-caption">그림을 보며 순서대로 말하고 직접 해 봐요.</p>`;}
if(reviewStage===6)body=`<h1>나는 할 수 있어요!</h1><div class="v4-illustration">☀️<span>나의 다짐</span></div><div class="v4-big">${esc((sel.length?sel.map(g=>g.text):[r.chosenGoal||r.next||r.promise]).join(' · '))}</div><div class="v4-speaking">💬 내 목소리로 다짐해요!</div>`;
return `<section class="panel v4-present"><div class="v4-top"><button onclick="tab('home')">종료</button><b>${esc(s.name)} · ${presentIdx+1}/${presentPeople.length}명</b><button onclick="tryFullscreen()">전체 화면</button></div><div class="v4-progress">${v4Stages.map((n,j)=>`<span class="${j===reviewStage?'active':''}">${j+1}</span>`).join('')}<b>${reviewStage+1}/7 ${v4Stages[reviewStage]}</b></div><div class="v4-body">${body}</div><div class="v4-nav"><button onclick="v4Nav(-1)">◀ 이전</button><button class="primary" onclick="v4Nav(1)">${reviewStage===6?'다짐 완료 · 다음 친구':'다음'} ▶</button></div></section>`;};
function v4OpenDaily(i){v4DailyStudent=i;v4DailyDate=v4Today();v4DailyResponse={...(db.weeks[monday(v4DailyDate)]?.[db.students[i].id]?.dailyChecks?.[v4DailyDate]?.responses||{})};v4DailyDone=false;mode='daily';render();}

function v4Daily(){const i=v4DailyStudent,s=db.students[i],r=record(i,monday(v4DailyDate)),gs=v4Goals(r,s);return `<section class="panel v4-present"><div class="v4-top"><button onclick="tab('home')">교사 화면</button><b>${esc(s.name)} · 오늘의 자기점검</b></div>${v4DailyDone?'<div class="v4-body"><div class="v4-illustration">✓</div><h1>오늘도 돌아보았어요!</h1><button class="primary" onclick="tab(\'dailyMenu\')">다음 학생</button></div>':`<h1>오늘 약속을 실천했나요?</h1><p class="v4-caption">${v4DailyDate}</p>${gs.map((g,j)=>`<div class="v4-dailygoal">${v4Img(g.image||s.poster)||v4AutoPicture(g.text)}<div class="v4-big">${esc(g.text)}</div>${v4Answers(v4DailyResponse[j],`v4DailySelect(${j},{k})`)}</div>`).join('')}<button class="primary v4-save" onclick="v4DailySave()">오늘의 자기평가 완료</button>`}</section>`;}

function v4PairRef(teacher,student){return cloudStore.collection('teacher_data').doc(teacher).collection('student_access').doc(student);}
async function v4Pair(i){if(!cloudUser||!cloudReady){alert('교사 Google 로그인 및 동기화부터 완료해 주세요.');return;}const uid=prompt('학생 전용 태블릿에 표시된 연결 코드(UID)를 붙여넣으세요.');if(!uid||!/^[A-Za-z0-9_-]{10,128}$/.test(uid)||uid===cloudUser.uid||db.students.some((x,j)=>j!==i&&x.tabletUid===uid)){alert('별도 학생 계정의 연결 코드를 확인해 주세요.');return;}if(db.students[i].tabletUid&&db.students[i].tabletUid!==uid){alert('기존 연결을 먼저 해제해 주세요.');return;}db.students[i].tabletUid=uid;save();await v4Publish(i);render();}
async function v4SmallImage(uri){if(!validImage(uri))return '';return new Promise(resolve=>{const im=new Image();im.onerror=()=>resolve('');im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,500/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.65,out=c.toDataURL('image/jpeg',q);while(out.length>85000&&q>.2){q-=.1;out=c.toDataURL('image/jpeg',q);}resolve(out.length<100000?out:'');};im.src=uri;});}
async function v4Publish(i,w=week){const s=db.students[i];if(!cloudUser||!s.tabletUid)return;try{const r=record(i,w),goals=await Promise.all(v4Goals(r,s).slice(0,2).map(async g=>({text:g.text,image:await v4SmallImage(g.image||s.poster)})));const ref=v4PairRef(cloudUser.uid,s.tabletUid),batch=cloudStore.batch();batch.set(ref,{active:true,studentId:s.id},{merge:true});batch.set(ref.collection('weeks').doc(w),{week:w,studentId:s.id,goals,days:DAYS.map((_,j)=>v4Date(w,j)),publishedAt:Date.now()});await batch.commit();toast('태블릿에 선택 주차 목표를 보냈어요.');}catch(e){alert('태블릿 연결 실패: '+e.message);}}
async function v4ImportTablet(quiet=false){if(!cloudReady||!cloudUser){if(!quiet)alert('클라우드 동기화를 먼저 시작하세요.');return;}let n=0;try{for(let i=0;i<db.students.length;i++){const s=db.students[i];if(!s.tabletUid)continue;const snap=await v4PairRef(cloudUser.uid,s.tabletUid).collection('checks').get({source:'server'});snap.forEach(doc=>{const x=doc.data();if(!/^\d{4}-\d{2}-\d{2}$/.test(doc.id)||x.studentId!==s.id||x.week!==monday(doc.id)||!Array.isArray(x.responses)||x.responses.length>2||!x.responses.every(k=>Number.isInteger(k)&&k>=0&&k<4))return;const r=record(i,x.week);r.dailyChecks??={};const prev=r.dailyChecks[doc.id];if(!prev||Number(x.at)>Number(prev.at)){r.dailyChecks[doc.id]={responses:Object.fromEntries(x.responses.map((v,j)=>[j,v])),at:x.at};n++;}});}if(n)save();if(!quiet)toast(n+'개 자기점검을 가져왔어요.');if(n||!quiet)render();}catch(e){if(!quiet)alert('자기점검 가져오기 실패: '+e.message);}}
async function v4Unpair(i){const s=db.students[i];if(!s.tabletUid||!cloudUser||!confirm('학생 태블릿 연결을 해제할까요?'))return;try{await v4PairRef(cloudUser.uid,s.tabletUid).set({active:false},{merge:true});delete s.tabletUid;save();render();}catch(e){alert(e.message);}}
function v4TabletPanel(){const link=cloudUser?`${location.origin}${location.pathname}?student=${encodeURIComponent(cloudUser.uid)}`:'';return `<section class="panel"><h2>학생 전용 태블릿 연결</h2><p class="hint">별도 학생 Google 계정과 Firebase 학생 접근 규칙 설정이 필요합니다. 교사 계정을 학생 태블릿에 로그인시키지 마세요. 연결 후 선택한 주의 목표만 보낼 수 있습니다. <a href="firestore.rules" target="_blank" rel="noopener">학생용 Firebase 규칙 보기</a></p>${link?`<div class="row"><input readonly value="${esc(link)}" onclick="this.select()"><button onclick="navigator.clipboard.writeText(${esc(JSON.stringify(link))}).then(()=>toast('링크 복사 완료'))">링크 복사</button><button onclick="v4ImportTablet()">태블릿 자기점검 가져오기</button></div>${db.students.map((s,i)=>`<div class="row v4-pair"><b>${esc(s.name)}</b><span>${s.tabletUid?'연결됨':'미연결'}</span><button onclick="v4Pair(${i})">연결</button>${s.tabletUid?`<button onclick="v4Publish(${i})">선택 주차 목표 보내기</button><button onclick="v4Unpair(${i})">해제</button>`:''}</div>`).join('')}`:'<p>교사 Google 로그인 후 연결 링크가 표시됩니다.</p>'}</section>`;}
settings=function(){return v4BaseSettings()+v4TabletPanel();};
function v4StudentRender(){document.querySelector('.shell').innerHTML=`<main id="studentApp" class="v4-studentapp"></main>`;document.body.classList.add('v4-tablet');const a=document.getElementById('studentApp');if(!v4StudentUser){a.innerHTML='<section class="panel v4-present"><h1>나의 약속 성장기</h1><div class="v4-illustration">☀️</div><button class="primary v4-save" onclick="v4StudentLogin()">학생 Google 로그인</button><p>선생님과 함께 학생 계정으로 로그인하세요.</p></section>';return;}if(!v4StudentDoc){a.innerHTML=`<section class="panel v4-present"><h1>선생님께 연결 코드 보여주기</h1><input readonly value="${esc(v4StudentUser.uid)}" onclick="this.select()"><button onclick="navigator.clipboard.writeText(${esc(JSON.stringify(v4StudentUser.uid))})">연결 코드 복사</button><button onclick="v4StudentRefresh()">연결 확인</button><button onclick="v4StudentAuth.signOut()">로그아웃</button></section>`;return;}const d=v4Today(),g=v4StudentDoc.goals||[];if(!v4StudentDoc.active||monday(d)!==v4StudentDoc.week||!v4StudentDoc.days?.includes(d)){a.innerHTML='<section class="panel v4-present"><h1>이번 주 목표를 기다려요</h1><button onclick="v4StudentRefresh()">새로고침</button><button onclick="v4StudentAuth.signOut()">로그아웃</button></section>';return;}a.innerHTML=`<section class="panel v4-present"><div class="v4-top"><b>오늘의 자기점검 · ${d}</b><button onclick="v4StudentAuth.signOut()">로그아웃</button></div>${v4StudentComplete?'<h1>오늘도 돌아보았어요!</h1><div class="v4-illustration">✓</div><button onclick="v4StudentRefresh()">다시 확인</button>':`<h1>오늘 약속을 실천했나요?</h1>${g.map((x,j)=>`<div class="v4-dailygoal">${v4Img(x.image)||v4AutoPicture(x.text)}<div class="v4-big">${esc(x.text)}</div><div class="v4-answers">${v4Labels.map((v,k)=>`<button class="v4-answer ${v4StudentAnswers[j]===k?'chosen':''}" onclick="v4StudentChoose(${j},${k})"><strong>${v4Symbols[k]}</strong><span>${v}</span></button>`).join('')}</div></div>`).join('')}<button class="primary v4-save" onclick="v4StudentSubmit()">자기점검 완료</button>`}</section>`;}
function v4StudentChoose(j,k){v4StudentAnswers[j]=k;v4StudentRender();}
async function v4StudentLogin(){try{await v4StudentAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}catch(e){alert(e.message);}}
function v4StudentRef(){return v4StudentStore.collection('teacher_data').doc(v4TabletTeacher).collection('student_access').doc(v4StudentUser.uid);}
async function v4StudentRefresh(){v4StudentDoc=null;v4StudentComplete=false;v4StudentAnswers={};try{let x=await v4StudentRef().get({source:'server'});if(x.exists&&x.data().active){const w=await v4StudentRef().collection('weeks').doc(monday(v4Today())).get({source:'server'});v4StudentDoc=w.exists?{...w.data(),active:true}:{active:true,week:''};const y=await v4StudentRef().collection('checks').doc(v4Today()).get({source:'server'});if(y.exists){v4StudentAnswers=Object.fromEntries(y.data().responses.map((k,j)=>[j,k]));v4StudentComplete=true;}}}catch(e){}v4StudentRender();}
async function v4StudentSubmit(){const d=v4Today(),g=v4StudentDoc?.goals||[];if(!g.length||g.some((_,j)=>v4StudentAnswers[j]==null)){alert('모든 질문에 답해 주세요.');return;}if(monday(d)!==v4StudentDoc.week||!v4StudentDoc.days?.includes(d)){await v4StudentRefresh();return;}try{await v4StudentRef().collection('checks').doc(d).set({studentId:v4StudentDoc.studentId,week:v4StudentDoc.week,responses:g.map((_,j)=>v4StudentAnswers[j]),at:Date.now()});v4StudentComplete=true;v4StudentRender();}catch(e){alert('저장하지 못했어요. 선생님께 알려주세요.');}}
async function v4StudentBoot(){document.querySelector('.shell').innerHTML='<section class="panel center"><h1>학생 화면 연결 중…</h1></section>';try{await loadSDK();const app=firebase.initializeApp(firebaseConfig,'haeoreum-student');v4StudentAuth=app.auth();v4StudentStore=app.firestore();v4StudentAuth.onAuthStateChanged(async u=>{v4StudentUser=u;if(u)await v4StudentRefresh();else v4StudentRender();});}catch(e){document.querySelector('.shell').textContent='연결에 실패했습니다. 다시 접속해 주세요.';}}

const v4CloudPull=cloudPull;cloudPull=async function(automatic=false){await v4CloudPull(automatic);if(cloudReady)await v4ImportTablet(true);};
let v4FocusBusy=false;window.addEventListener('focus',async()=>{if(v4TabletTeacher||!cloudReady||cloudBusy||cloudDirty||v4FocusBusy)return;v4FocusBusy=true;try{const m=await manifest().get({source:'server'});if(m.exists&&m.data().rev!==cloudRevision&&!cloudDirty&&!cloudBusy)await cloudPull(true);else await v4ImportTablet(true);}catch(e){}finally{v4FocusBusy=false;}});
if(v4TabletTeacher&&/^[A-Za-z0-9_-]{10,128}$/.test(v4TabletTeacher))v4StudentBoot();else boot();
</script></body></html>
