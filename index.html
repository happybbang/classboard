let db;try{db=JSON.parse(localStorage.getItem(KEY))||base()}catch(e){db=base()}let selected=0,dayIdx=0,mode='home',presentIdx=0,presentPeople=[],cardEditing=null,printType='poster',printAll=true,chartSelected=0,selectedIcon='💬';
const pad=n=>String(n).padStart(2,'0');function monday(d){let t=new Date(d+'T12:00:00');if(isNaN(t))t=new Date();t.setDate(t.getDate()-(t.getDay()+6)%7);return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`};let week=monday(new Date().toISOString().slice(0,10));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('저장 공간이 부족합니다. 설정에서 백업을 내려받아 주세요.') }}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}function record(i,w=week){db.weeks[w]??={};db.weeks[w][db.students[i].id]??={scores:[null,null,null,null,null],plus:[0,0,0,0,0],notes:['','','','',''],positive:'',practice:'',next:'',promise:db.students[i].promise,how:db.students[i].how,icon:db.students[i].icon,positiveIcon:'🌟',practiceIcon:'💡'};return db.weeks[w][db.students[i].id]};function weekDates(){let d=new Date(week+'T12:00:00');return DAYS.map((a,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return `${a} ${x.getMonth()+1}/${x.getDate()}`})}function total(r){return r.scores.reduce((n,x,i)=>n+(x===null?0:Number(x)+Number(r.plus[i]||0)),0)}function getBadges(i){return db.badges.filter(b=>b.sid===db.students[i].id)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function moveWeek(n){let d=new Date(week+'T12:00:00');d.setDate(d.getDate()+7*n);week=monday(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);render()}function prevWeek(){moveWeek(-1)}function nextWeek(){moveWeek(1)}function tab(t){mode=t;render();window.scrollTo({top:0,behavior:'instant'})}function switchStudent(i){selected=i;render()}function render(){document.getElementById('week').value=week;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===mode));document.getElementById('app').innerHTML=({home:home,edit:edit,coach:coach,present:present,badges:badges,history:history,print:printView,settings:settings})[mode]();}
function home(){return `<section class="panel"><div class="row between"><h2>☀️ 이번 주 일곱 명의 약속</h2><span class="pill">${week} 시작</span></div><p class="hint">학생 카드를 누르면 약속과 점수를 수정할 수 있습니다. 값이 없는 날은 아직 평가하지 않은 날입니다.</p><div class="grid3">${db.students.map((s,i)=>{let r=record(i);return `<button class="student-card" onclick="selected=${i};tab('edit')"><img class="portrait" src="${IMGS[s.img]}"><div style="flex:1"><div class="name">${esc(s.name)} <small class="muted" style="font-size:12px">${db.attendance[i]?'금요일 참석':'발표 제외'}</small></div><p style="font-size:14px;margin:5px 0">${esc(r.promise)}</p><div class="row">${r.scores.map((x,j)=>`<span class="chip">${DAYS[j]} ${x===null?'–':x+(r.plus[j]?'+'+r.plus[j]:'')}</span>`).join('')}</div><div style="margin-top:8px;font-weight:900;color:#2474d2">총점 ${total(r)}점</div></div></button>`}).join('')}</div></section><section class="panel"><h2>🎉 금요일 15분 발표 준비</h2><p>준비가 된 학생만 선택해 발표할 수 있습니다. 현재 <b>${db.attendance.filter(Boolean).length}명</b> 선택되어 있습니다.</p><div class="row">${db.students.map((s,i)=>`<label class="choice ${db.attendance[i]?'checked':''}"><input style="width:auto" type="checkbox" ${db.attendance[i]?'checked':''} onchange="toggleAttend(${i},this.checked)"> ${esc(s.name)}</label>`).join('')}</div><p class="hint">발표 전 교사 화면에서 칭찬 행동·다음 행동을 적어 주세요. 다른 학생의 부족한 점을 공개하지 않도록 연습 행동 카드는 발표 시 숨길 수도 있습니다.</p><button class="primary" onclick="startPresent()">▶ 선택한 학생 발표 시작</button></section>`}

function edit(){let s=db.students[selected],r=record(selected);return `<section class="panel"><div class="row between"><h2>✏️ 학생별 약속과 점수</h2><span class="pill">자동 저장</span></div><div class="row">${db.students.map((x,i)=>`<button class="${i===selected?'active':''}" onclick="switchStudent(${i})">${esc(x.name)}</button>`).join('')}</div></section><div class="grid"><section class="panel"><div class="row"><img class="edit-promise-img" src="${IMGS[s.img]}"><div><h2>${esc(s.name)}의 약속</h2><p class="hint">이 주차에 적용된 약속은 개별 보관됩니다.</p></div></div><label class="label">이번 주 약속</label><input id="promise" value="${esc(r.promise)}" oninput="updateField('promise',this.value)"><label class="label">약속을 지키는 방법</label><textarea oninput="updateField('how',this.value)">${esc(r.how)}</textarea><label class="label">대표 그림 이모지</label><div class="row">${icons.map(c=>`<button class="${r.icon===c?'active':''}" onclick="updateField('icon','${c}');render()">${c}</button>`).join('')}</div><p class="hint">약속을 바꾸면 현재 주에만 적용됩니다. 원본 약속판 이미지는 기존 그림으로 남아 있습니다.</p><button onclick="applyPromiseToFuture()">이 약속을 다음 새 주차의 기본값으로 저장</button></section><section class="panel"><h2>⭐ 월~금 점수 입력</h2><div class="day-row">${r.scores.map((x,i)=>`<button class="day ${dayIdx===i?'selected-day':''}" onclick="dayIdx=${i};render()"><small>${DAYS[i]}</small><strong>${x===null?'–':x}${r.plus[i]?'⁺'+r.plus[i]:''}</strong></button>`).join('')}</div><p class="label">${weekDates()[dayIdx]} · 기본 점수(0~5점)</p><div class="scorebuttons">${[0,1,2,3,4,5].map(n=>`<button class="${r.scores[dayIdx]===n?'active':''}" onclick="score(${n})">${n}점</button>`).join('')}<button onclick="score(null)">미입력</button></div><p class="label">특별 칭찬 점수 (+ 표시 1개 = 1점)</p><div class="row"><button onclick="bonus(-1)">－</button><strong class="stat">+${r.plus[dayIdx]}</strong><button onclick="bonus(1)">＋</button></div><label class="label">그날의 짧은 관찰 기록</label><textarea oninput="noteChange(this.value)">${esc(r.notes[dayIdx])}</textarea><hr class="separator"><div class="row between"><b>이번 주 총점</b><strong class="stat">${total(r)}점</strong></div><p class="hint">미입력 날짜는 총점 계산에서 제외합니다. 기록하지 않은 날을 0점으로 간주하지 않습니다.</p></section></div><section class="panel"><h2>💗 칭찬과 다음 행동</h2><div class="grid"><div><label class="label">이번 주 빛나는 행동</label><textarea id="positive" oninput="updateField('positive',this.value)" placeholder="예: 친구가 이야기할 때 끝까지 기다렸어요.">${esc(r.positive)}</textarea><label class="label">칭찬 그림</label><select onchange="updateField('positiveIcon',this.value)">${icons.map(x=>`<option ${r.positiveIcon===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">더 연습할 행동(선택)</label><textarea oninput="updateField('practice',this.value)" placeholder="예: 속상하면 차분한 목소리로 말해요.">${esc(r.practice)}</textarea><label class="label">다음 행동 그림</label><select onchange="updateField('practiceIcon',this.value)">${icons.map(x=>`<option ${r.practiceIcon===x?'selected':''}>${x}</option>`).join('')}</select></div></div><label class="label">다음 주 나의 작은 도전</label><input oninput="updateField('next',this.value)" value="${esc(r.next)}" placeholder="예: 말하기 전에 한 번 생각하기"><div class="row" style="margin-top:14px"><button class="gold" onclick="selectedBadgeStudent=${selected};tab('badges')">🏅 칭찬 배지 지급</button><button onclick="tab('coach')">💡 지도 카드 작성하기</button><button class="green" onclick="toast('기록이 이 기기에 저장되어 있습니다.')">✔ 저장 확인</button></div></section>`}
function updateField(k,v){record(selected)[k]=v;save()}function applyPromiseToFuture(){let s=db.students[selected],r=record(selected);s.promise=r.promise;s.how=r.how;s.icon=r.icon;save();toast('앞으로 새로 생성하는 주차의 기본 약속으로 저장했습니다.')}function score(n){let r=record(selected);r.scores[dayIdx]=n;if(n===null)r.plus[dayIdx]=0;save();render()}function bonus(d){let r=record(selected);if(r.scores[dayIdx]===null)r.scores[dayIdx]=5;r.plus[dayIdx]=Math.max(0,r.plus[dayIdx]+d);save();render()}function noteChange(v){record(selected).notes[dayIdx]=v;save()}

function award(i){let type=document.getElementById('badgeType').value,reason=document.getElementById('badgeReason').value.trim(),date=document.getElementById('badgeDate').value;if(!reason){alert('칭찬받은 행동을 먼저 입력해 주세요.');return}db.badges.push({id:uid(),sid:db.students[i].id,type,reason,date,week});save();toast('🎊 칭찬 배지를 받았어요!');render()}function removeBadge(id){if(confirm('이 배지 기록을 삭제할까요?')){db.badges=db.badges.filter(b=>b.id!==id);save();render()}}
const suggestions=[['큰 소리로 말했어요.','작고 차분한 목소리로 이야기해요.','🗣️'],['활동을 시작하기 어려웠어요.','첫 번째 활동부터 시작하고 어려우면 도움을 요청해요.','🙋'],['친구가 말하는 동안 끼어들었어요.','친구의 말이 끝난 다음 이야기해요.','👂'],['준비물을 잊어버렸어요.','수업 전에 준비물 목록을 확인해요.','🎒'],['마음이 속상했어요.','마음을 말로 알리고 정해진 곳에서 쉬어요.','💗'],['과제를 포기하고 싶었어요.','할 수 있는 한 가지부터 해 봐요.','🚀']];
function coach(){let s=db.students[selected];return `<section class="panel"><h2>💡 행동 지도 카드 만들기</h2><p class="warning"><b>안내:</b> 이 오프라인 버전은 AI에 연결되어 있지 않습니다. 교사의 입력에 따라 쉬운 문장을 직접 작성하고, 준비된 대체 행동 예시를 선택해 2컷 카드로 보여줍니다. 새로운 상황의 AI 자동 그림 생성은 지원하지 않습니다.</p><div class="row">${db.students.map((x,i)=>`<button class="${selected===i?'active':''}" onclick="switchStudent(${i})">${esc(x.name)}</button>`).join('')}</div></section><div class="grid"><section class="panel"><h2>📝 ${esc(s.name)} 지도 내용</h2><label class="label">관찰한 상황</label><textarea id="situation" placeholder="예: 친구가 먼저 이야기하는데 중간에 끼어들었어요."></textarea><label class="label">다음에 실천할 대체 행동</label><textarea id="alternative" placeholder="예: 친구 말이 끝나면 내 차례에 이야기해요."></textarea><label class="label">쉽게 설명하는 한마디</label><input id="coachLine" placeholder="예: 차례를 기다리면 서로 이야기하기 좋아요."><label class="label">대표 그림</label><select id="coachIcon">${icons.map(x=>`<option>${x}</option>`).join('')}</select><p class="label">자주 사용하는 예시</p>${suggestions.map((x,j)=>`<button style="margin:3px" onclick="fillCoach(${j})">${esc(x[1])}</button>`).join('')}<div class="row" style="margin-top:16px"><button class="green" onclick="createCard()">✔ 지도 카드 저장</button></div></section><section class="panel"><h2>🖼️ 저장한 2컷 지도 카드</h2>${db.cards.filter(c=>c.sid===s.id).slice().reverse().map(c=>`<div class="bullet"><div class="row between"><b>${esc(c.date)} · ${esc(c.alt)}</b><button onclick="removeCard('${c.id}')">삭제</button></div><div class="grid"><div class="practice center"><div class="large-emoji">🤔</div><b>어떤 일이 있었나요?</b><p>${esc(c.situation)}</p></div><div class="positive center"><div class="large-emoji">${esc(c.icon)}</div><b>다음에는 이렇게 해요!</b><p>${esc(c.alt)}</p></div></div><p class="hint">${esc(c.line)}</p><button onclick="useCard('${c.id}')">이 대체 행동을 이번 주에 적용</button></div>`).join('')||'<p class="hint">아직 카드가 없습니다. 왼쪽에서 하나 만들어 보세요.</p>'}</section></div>`}
function fillCoach(j){let a=suggestions[j];document.getElementById('situation').value=a[0];document.getElementById('alternative').value=a[1];document.getElementById('coachLine').value='다음에 같은 일이 생기면 이렇게 실천해 보아요.';document.getElementById('coachIcon').value=a[2]}
function createCard(){let situation=document.getElementById('situation').value.trim(),alt=document.getElementById('alternative').value.trim(),line=document.getElementById('coachLine').value.trim(),icon=document.getElementById('coachIcon').value;if(!alt){alert('대체 행동을 입력해 주세요.');return}db.cards.push({id:uid(),sid:db.students[selected].id,situation,alt,line,icon,date:new Date().toISOString().slice(0,10)});save();toast('지도 카드를 저장했습니다.');render()}function removeCard(id){if(confirm('카드를 삭제할까요?')){db.cards=db.cards.filter(c=>c.id!==id);save();render()}}function useCard(id){let c=db.cards.find(x=>x.id===id);if(c){let r=record(selected);r.practice=c.alt;r.practiceIcon=c.icon;r.next=c.alt;save();toast('이번 주 행동 지도 내용에 적용했습니다.')}}
function startPresent(){presentPeople=db.students.map((x,i)=>i).filter(i=>db.attendance[i]);if(!presentPeople.length){alert('발표할 학생을 선택해 주세요.');return}presentIdx=0;mode='present';render();try{document.documentElement.requestFullscreen?.().catch(()=>{})}catch(e){}}
function present(){if(!presentPeople.length)presentPeople=db.students.map((x,i)=>i).filter(i=>db.attendance[i]);if(!presentPeople.length)return '<div class="panel">전체 현황에서 발표 학생을 선택해 주세요.</div>';presentIdx=Math.max(0,Math.min(presentIdx,presentPeople.length-1));let i=presentPeople[presentIdx],s=db.students[i],r=record(i),earned=db.badges.filter(b=>b.sid===s.id&&b.week===week),dates=weekDates();return `<section class="panel present"><div class="focusnav no-print"><button onclick="tab('home')">✕ 발표 종료</button><div class="mini-progress">${presentIdx+1} / ${presentPeople.length}명 · ${esc(s.name)} 차례</div><button onclick="tryFullscreen()">⛶ 전체 화면</button></div><div class="hero" style="margin-top:12px"><span class="pill">${esc(s.name)}의 이번 주 약속</span><div class="bigtext" style="margin-top:10px">${esc(r.promise)}</div><div class="row" style="justify-content:center"><span style="font-size:40px">${esc(r.icon)}</span><div style="font-size:clamp(15px,2vw,22px);font-weight:800">${esc(r.how)}</div></div></div><div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);margin-top:12px"><div><div class="panel" style="border:1px solid #e9eef5"><div class="row between"><h2>⭐ 이번 주 점수</h2><strong class="stat">${total(r)}점</strong></div><div class="day-row">${r.scores.map((v,j)=>`<div class="day"><small>${DAYS[j]}</small><strong>${v===null?'–':v}</strong>${r.plus[j]?`<small style="color:#d98d1a;font-weight:900">+${r.plus[j]}</small>`:''}</div>`).join('')}</div><p class="hint">기본 5점 만점 · 특별 칭찬 +점수</p></div><div class="panel center" style="border:1px solid #e9eef5"><img class="preview-img" src="${IMGS[s.img]}" alt="${esc(s.name)}의 기존 약속 그림"></div></div><div><div class="positive"><div class="actiontitle">🌟 이번 주 빛나는 행동!</div><div class="actionrow"><div>${esc(r.positiveIcon)}</div><div class="bigtext">${esc(r.positive||'이번 주 잘한 일을 함께 찾아봐요!')}</div></div></div>${r.practice?`<div class="practice" style="margin-top:10px"><div class="actiontitle">💡 다음에는 이렇게 해요!</div><div class="actionrow"><div>${esc(r.practiceIcon)}</div><div class="bigtext">${esc(r.practice)}</div></div></div>`:''}<div class="bullet" style="font-size:20px;font-weight:900;margin-top:12px">🌱 다음 주 도전: ${esc(r.next||r.how)}</div>${earned.length?`<div class="badgecard celebrate center"><span style="font-size:40px">${badgeTypes.find(x=>x[0]===earned.at(-1).type)?.[1]||'🌟'}</span> <b>이번 주 ${esc(earned.at(-1).type)} 배지 획득!</b><div class="hint">${esc(earned.at(-1).reason)}</div></div>`:''}</div></div><div class="focusnav no-print" style="margin-top:10px"><button onclick="presentIdx=Math.max(0,presentIdx-1);render()" ${presentIdx===0?'disabled':''}>◀ 이전 친구</button><button class="gold" onclick="cheer()">👏 다 같이 칭찬!</button><button class="primary" onclick="presentIdx=presentIdx+1;if(presentIdx>=presentPeople.length){tab('finish')}else{render()}">다음 친구 ▶</button></div></section>`}
function tryFullscreen(){document.documentElement.requestFullscreen?.().catch(()=>toast('브라우저의 전체 화면 기능을 사용할 수 없습니다.'))}function cheer(){toast('🎉 멋진 행동을 칭찬해요!')}const originalTab=tab;tab=function(t){if(t==='finish'){mode='home';render();document.getElementById('app').innerHTML=`<section class="panel center"><div style="font-size:90px">🎊</div><h1>우리 모두 이번 주도 수고했어요!</h1><p class="bigtext">다음 주에도 나만의 약속에 도전해요!</p><p>이제 친구들과 즐겁게 닌텐도 활동을 해요.</p><button class="primary" onclick="tab('home')">돌아가기</button></section>`;document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));return}originalTab(t)};
function history(){let i=chartSelected,s=db.students[i],weeks=Object.keys(db.weeks).sort().filter(w=>db.weeks[w][s.id]);return `<section class="panel"><h2>📈 학생별 성장 기록 · 상담 자료</h2><div class="row">${db.students.map((x,j)=>`<button class="${i===j?'active':''}" onclick="chartSelected=${j};render()">${esc(x.name)}</button>`).join('')}</div><p class="hint">점수 외에도 그 주의 약속과 칭찬·대체 행동을 함께 확인하세요. 서로 다른 약속을 수행한 점수를 단순 비교하지 않도록 주의해 주세요.</p></section><div class="panel"><h2>${esc(s.name)}의 주간 총점</h2>${weeks.length?`<div class="chartbox">${weeks.slice(-12).map(w=>{let r=db.weeks[w][s.id],v=total(r);return `<div class="colouter"><strong>${v}</strong><div class="chartcol" style="height:${Math.min(100,Math.round(v/35*100))}px"></div><small>${esc(w.slice(5))}</small></div>`}).join('')}</div>`:'<p class="hint">아직 주간 점수 기록이 없습니다.</p>'}<div class="records" style="margin-top:20px">${weeks.slice().reverse().map(w=>{let r=db.weeks[w][s.id];return `<div class="record"><b>${esc(w)} · ${total(r)}점</b><p>약속: ${esc(r.promise)}</p><p>🌟 칭찬: ${esc(r.positive||'기록 없음')}</p><p>🌱 다음 행동: ${esc(r.next||r.practice||'기록 없음')}</p></div>`}).join('')}</div><button onclick="window.print()">🖨️ 현재 화면 인쇄(브라우저 인쇄)</button></div>`}
function printView(){return `<section class="panel no-print"><h2>🖨️ 출력 자료</h2><div class="row"><button class="${printType==='poster'?'active':''}" onclick="printType='poster';render()">빈 주간 약속판</button><button class="${printType==='result'?'active':''}" onclick="printType='result';render()">주간 결과표</button><button class="${printType==='counsel'?'active':''}" onclick="printType='counsel';render()">상담용 기록표</button></div><p class="hint">7명 전체 또는 한 학생만 선택하여 A4로 출력합니다. 각 학생의 원본 약속 그림을 활용합니다.</p><label class="choice"><input type="checkbox" style="width:auto" ${printAll?'checked':''} onchange="printAll=this.checked;render()"> 7명 전체 출력</label>${!printAll?`<select onchange="selected=Number(this.value);render()">${db.students.map((s,i)=>`<option value="${i}" ${i===selected?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:''}<div style="margin:14px 0"><button class="primary" onclick="window.print()">🖨️ 인쇄 또는 PDF로 저장</button></div></section><div id="pages">${db.students.map((s,i)=>!printAll&&i!==selected?'':paper(s,i)).join('')}</div>`}
function paper(s,i){let r=record(i);if(printType==='poster')return `<article class="poster"><h1>☀️ ${esc(s.name)}의 약속</h1><div class="posterprom">${esc(r.promise)}</div><img src="${IMGS[s.img]}"><div class="day-row">${DAYS.map(d=>`<div class="day"><b>${d}</b><p style="border:1px solid #ccc;height:36px;background:white;border-radius:6px"></p></div>`).join('')}</div><p style="text-align:center;font-size:22px">이번 주 총점: _______ 점</p></article>`;if(printType==='result')return `<article class="paperpage"><div class="printhead">☀️ ${esc(s.name)}의 주간 약속 돌아보기</div><p>${esc(week)} · ${esc(r.promise)}</p><div class="day-row">${r.scores.map((x,j)=>`<div class="day">${DAYS[j]}<strong>${x===null?'–':x}</strong>${r.plus[j]?`+${r.plus[j]}`:''}</div>`).join('')}</div><h2>이번 주 총점: ${total(r)}점</h2><div class="positive"><h2>🌟 잘한 행동</h2><p>${esc(r.positive)}</p></div><div class="practice" style="margin-top:15px"><h2>🌱 다음 행동</h2><p>${esc(r.practice||r.next)}</p></div><p>다음 주 도전: ${esc(r.next)}</p></article>`;let weeks=Object.keys(db.weeks).sort().filter(w=>db.weeks[w][s.id]);return `<article class="paperpage"><div class="printhead">${esc(s.name)} · 약속 성장 관찰 기록</div><p>인쇄일: ${new Date().toLocaleDateString('ko-KR')}</p>${weeks.map(w=>{let x=db.weeks[w][s.id];return `<div class="bullet"><b>${esc(w)} · ${total(x)}점</b><p>약속: ${esc(x.promise)}</p><p>잘한 행동: ${esc(x.positive)}</p><p>연습·대체 행동: ${esc(x.practice)}</p><p>다음 목표: ${esc(x.next)}</p></div>`}).join('')}</article>`}
function settings(){return `<section class="panel"><h2>⚙️ 데이터 백업과 운영 설정</h2><div class="safe">기본 기록은 이 브라우저의 로컬 저장소에 저장됩니다. 서버로 전송되지 않지만 브라우저 데이터 삭제·다른 PC 사용 시 사라질 수 있습니다. 정기적으로 JSON 백업 파일을 저장해 주세요.</div><div class="row" style="margin:18px 0"><button class="primary" onclick="exportJSON()">⬇ 기록 전체 백업(JSON)</button><label class="choice">⬆ 백업 복원 <input type="file" accept="application/json,.json" onchange="importJSON(this.files[0])"></label></div><h2>학생 이름과 발표 참석 여부</h2>${db.students.map((s,i)=>`<div class="row" style="margin:8px 0"><input style="max-width:180px" aria-label="${esc(s.name)} 이름" value="${esc(s.name)}" onchange="renameStudent(${i},this.value)"><label><input type="checkbox" style="width:auto" ${db.attendance[i]?'checked':''} onchange="toggleAttend(${i},this.checked)"> 금요일 발표 참여</label></div>`).join('')}<hr class="separator"><h2>개인정보와 사용 안내</h2><p class="hint">교실 공용 PC 사용을 피하고, 행동 기록을 다른 학생이나 외부에 공유하지 마세요. 현재 앱에는 사용자 로그인·서버 동기화 기능이 없습니다. AI로 자동 생성하는 그림이나 문장은 포함되지 않았으며, 행동 지도 카드를 직접 만드는 오프라인 방식입니다.</p><button onclick="if(confirm('모든 학생 점수와 배지 기록을 삭제하고 초기 상태로 되돌릴까요? 백업 후 진행하세요.')){db=base();save();render()}">⚠ 전체 데이터 초기화</button></section>`}
function renameStudent(i,v){v=v.trim();if(v){db.students[i].name=v;save();render()}}function exportJSON(){const blob=new Blob([JSON.stringify({format:'haeoreum_v1',saved:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='해오름반_약속기록_'+week+'.json';a.click();URL.revokeObjectURL(u)}function importJSON(file){if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let val=JSON.parse(rd.result);if(val.format!=='haeoreum_v1'||!Array.isArray(val.data?.students)||!val.data.weeks){throw Error('형식이 올바르지 않습니다')}if(!confirm('현재 기록을 백업 파일의 내용으로 대체할까요?'))return;db=val.data;save();render();toast('기록을 복원했습니다.')}catch(e){alert('백업 파일을 읽을 수 없습니다: '+e.message)}};rd.readAsText(file)}
document.getElementById('week').addEventListener('change',e=>{week=monday(e.target.value);render()});render();
</script></body></html>
