<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>우리 사이, 다음 한마디</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10142e;color:#f8f7ff;font:clamp(16px,1.65vw,26px)/1.45 system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:2vh 3vw}h1,h2,p{margin:0 0 .45em}h1{font-size:clamp(30px,3.5vw,58px)}header,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:22px}.panel{background:#222748;border:1px solid #41496d;border-radius:22px;padding:20px}button,input,select{font:inherit;border:0;border-radius:10px;padding:.35em .7em}button{cursor:pointer;background:#dce5ff;color:#172044;font-weight:750}button:disabled{opacity:.45;cursor:default}.primary{background:#ffe198}button:focus-visible{outline:3px solid white;outline-offset:3px}input{width:5em}.scores{display:flex;gap:12px;margin:0 0 12px}.score{flex:1;border-radius:12px;padding:9px;font-weight:800;color:#13152b}.mint{background:#71efd2}.orange{background:#ffac79}.track{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.tile{min-height:clamp(52px,8vh,88px);position:relative;border-radius:12px;padding:5px;text-align:center;background:#353d67;border:2px solid transparent;font-weight:800}.special{background:#594687;color:#fff0a6}.track .land{border-color:#ffe198;box-shadow:0 0 12px #ffe19866}.markers{display:flex;justify-content:center;gap:4px}.token{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;color:#151832;font-weight:900}.muted{color:#c1cae9}#status{color:#ffe198;font-weight:800}#scene,#question{font-size:1.13em}#question{color:#ffe198;font-weight:750}#die{font-size:1.7em;line-height:1.2;min-width:2ch;color:#ffe198}#hintText{margin-top:12px;color:#9ff1d9}details{margin-top:10px}summary{cursor:pointer}[hidden]{display:none!important}@media(max-width:820px){.layout{grid-template-columns:1fr}.panel{padding:12px}}

</style><main><header><h1>우리 사이, 다음 한마디</h1><button id="full">전체 화면</button></header>
<div class="layout"><section class="panel"><div class="scores"><div class="score mint" id="scoreA"></div><div class="score orange" id="scoreB"></div></div><div id="track" class="track" aria-label="24칸 순환 게임판"></div><p class="muted">★ 특별 미션 · 24번 다음은 1번</p></section>
<section class="panel"><form id="setup"><h2>팀별 참가 인원</h2><p>각 팀은 자리 순서대로 번호를 정해요.</p><p><label>민트팀 <input id="a" type="number" min="1" max="20" value="10" required></label> <label>주황팀 <input id="b" type="number" min="1" max="20" value="10" required></label></p><button class="primary">경기 시작</button></form>
<div id="game" hidden><p id="status" role="status"></p><h2 id="title"></h2><p id="scene"></p><div class="comic" id="comic" aria-hidden="true" hidden></div><p id="question"></p><div class="row"><span id="die"></span><button id="roll" class="primary">주사위 굴리기</button></div>
<div id="actions" hidden><div class="row"><button id="hint">말 힌트</button><button id="next" class="primary">미션 완료</button></div><p id="hintText" hidden></p><p id="swapBox"><label for="swap">동의한 팀원과 차례 바꾸기</label> <select id="swap"></select></p></div>
<button id="again" hidden>새 경기</button></div></section></div>
<details><summary>교사용 진행 안내</summary><p>팀을 번갈아 진행합니다. 미션은 한마디로 답합니다. 힌트를 골라 말해도 완료로 인정합니다. 교사는 모두가 답할 때까지 진행하고, 최종 이동 거리가 더 긴 팀을 확인합니다. 인원이 다르면 1인당 평균 이동 거리로 비교합니다. 동점이면 공동 우승입니다.</p><button id="reset">경기 초기화</button></details></main><script>

['나도 공을 받고 싶어요','체육 시간에 같은 팀 친구들이 패스하고 있어요. 나는 아직 공을 못 받았어요.','다음에 공을 받고 싶다면?','나 여기 있어! 다음엔 나한테도 패스해 줘.'],
['패스를 못 봤어요','경기 중에 한 친구가 손든 걸 못 봤어요. 그 친구가 공을 받고 싶다고 말해요.','뭐라고 대답할까요?','손든 걸 못 봤어. 다음에 기회 되면 줄게.'],
['나도 할 말이 있어요','친구 두 명이 이야기하는데 나도 좋은 생각이 떠올랐어요.','말할 차례를 어떻게 부탁할까요?','그 얘기 끝나면 나도 한마디 해도 돼?'],
['친구도 할 말이 있대요','내가 말하는 중에 친구가 자기도 할 말이 있다고 해요.','친구에게 어떻게 답할까요?','응, 이것만 말하고 네 얘기 들을게.'],
['지금은 듣기 어려워요','숙제를 마무리하는 중에 친구가 오늘 본 이야기를 꺼냈어요.','지금은 듣기 어렵다는 걸 어떻게 말할까요?','나 이것만 끝내고 들어도 될까?'],
['사과를 들었어요','친구가 연필을 떨어뜨리고 사과했어요. 괜찮다고 답했는데 다시 사과해요.','하던 일을 이어가고 싶다면?','응, 사과 들었어. 이제 하던 거 하자.'],
['괜찮다는 답을 들었어요','친구의 연필을 떨어뜨려 사과했어요. 친구가 괜찮다고 했어요.','사과한 나는 뭐라고 답할까요?','알겠어. 연필은 여기 둘게.'],
['옆에서 흉내 낼 때','친구가 발표하다 말을 멈췄어요. 옆 친구가 그 모습을 흉내 내며 웃어요.','옆 친구에게 뭐라고 할까요?','그만 따라 하자. 발표 계속 듣자.'],
['조금 작게 말해 줘','친구가 가까이에서 큰 목소리로 말해서 깜짝 놀랐어요.','내가 원하는 걸 어떻게 말할까요?','잘 들려. 조금만 작게 말해 줄래?'],
['친절이 어긋났어요','친구 몫까지 정리해 줬는데 친구는 그 일을 몰라요. 조금 서운해요.','내가 한 일을 어떻게 알려줄까요?','네 자리에 있던 종이는 내가 여기 모아 뒀어.'],
['아직 잘 못 알아들었어요','친구가 무언가 알려 줬는데 어느 책을 펼치라는지 모르겠어요.','어떻게 다시 물을까요?','어느 책인지 한 번만 더 말해 줄래?'],
['다른 이야기로 넘어갔어요','발표 순서를 정하던 중 친구가 갑자기 다른 이야기를 꺼냈어요.','하던 이야기를 이어가려면?','우리 발표 순서부터 정하고 그 얘기는 이따 듣자.'],
['잠깐 쉬고 싶어요','서로 말하다 보니 목소리가 높아졌어요. 조금 진정하고 다시 이야기하고 싶어요.','잠깐 멈출 때 뭐라고 할까요?','우리 잠깐 쉬었다가 다시 얘기하자.'],
['내 이야기도 확인하고 싶어요','모둠 역할이 정해졌는데 내가 말한 의견은 잘 전달되지 않은 것 같아요.','답답한 마음을 어떻게 전할까요?','잠깐, 내 생각도 한 번만 들어줄래?'],
['수군거림이 계속돼요','쉬는 시간마다 몇 명이 한 친구를 두고 수군거려요. 어떻게 해야 할지 모르겠어요.','선생님에게 조용히 어떻게 알릴까요?','선생님, 쉬는 시간에 친구를 두고 수군거리는 일이 계속돼요.'],
['잠깐 멈춰 듣기','친구가 걸어오며 가방에 달린 새 키링을 보여줘요.','짧게 어떤 말을 건넬 수 있을까요?','오, 새로 달았어? 보여줘!']
];

const special=[
 ['★ 이어 말하기','친구가 “나 혼자 해볼게”라고 말했어요. 도움을 주려던 사람이 대답할 차례예요.','“알겠어” 뒤에 자연스럽게 한마디를 붙여 보세요.','알겠어. 막히면 편하게 말해 줘.'],
 ['★ 말투 바꾸기','모둠에서 내 말이 잘 들리지 않아 “아, 내 말 좀 들어!”라고 말하고 싶어졌어요.','같은 부탁을 평소 목소리로 다시 말해 보세요.','나도 이야기 하나 해도 돼?'],
 ['★ 두 사람의 한마디','복도에서 어깨가 부딪혔어요. 한 사람은 놀랐고 다른 사람은 실수였어요.','두 사람의 말을 이어 보세요. 팀원 한 명과 한 문장씩 말해도 돼요.','“방금 부딪혀서 놀랐어.” “미안, 내가 못 봤어.”'],
 ['★ 5초 한마디','친구가 발표할 때 옆 친구가 흉내 내며 웃기 시작했어요.','하나, 둘, 셋, 넷, 다섯. 짧게 한마디 해보세요.','그만 따라 하자.']
];
const track=cards.slice();
[4,10,16,22].forEach((index,i)=>track.splice(index,0,special[i]));
const scenes=[
 ['📚　🧑🏻','준비물 어디 있지?','🧑🏻　🙋🏽','나 혼자 찾아볼게.'],
 ['🧑🏻　📝','문제 푸는 중','🧑🏻　✏️　🧑🏽','답 써 줄게.'],
 ['🚶🏻　💥　🚶🏽','복도에서 어깨가 툭!','😯　　 🚶🏽','어? 그냥 가네.'],
 ['🚶🏻　💥　🚶🏽','내가 어깨를 툭!','😮　　🧑🏽','앗, 못 봤어.'],
 ['🏀　🤾🏽　🤾🏻','팀원끼리 패스','🙋🏻　　 🏀','나도 받고 싶은데…'],
 ['🙋🏻　　 🤾🏽','친구가 손을 들었어요.','🧑🏻　🏀　🧑🏽','나한테도 패스해 줘.'],
 ['🗣️　🧑🏽','친구들이 이야기 중','💡　🧑🏻','나도 생각났어!'],
 ['🧑🏻　🗣️','내가 이야기 중','🙋🏽　🧑🏻','나도 할 말 있어.'],
 ['🧑🏻　📝','숙제 마무리 중','🧑🏽　💬　🧑🏻','나 오늘 뭐 봤게?'],
 ['✏️　⬇️　😯','미안!','🧑🏽　🧑🏻','괜찮아. / 진짜 미안해.'],
 ['🧑🏻　✏️','떨어뜨려서 미안해.','🧑🏽　💬','괜찮아.'],
 ['🧑🏻　🎤','발표하다 잠깐 멈췄어요.','🧑🏽　🤭','옆 친구가 흉내 내요.'],
 ['🧑🏽　📣　😮','바로 옆에서 큰 목소리','😯　🧑🏽','깜짝 놀랐어!'],
 ['🧑🏻　🗂️','친구 종이도 정리했어요.','😕　🚶🏽','친구는 모르고 지나가요.'],
 ['🧑🏽　📚','그 책 펴면 돼.','🧑🏻　📕📘','어느 책이지?'],
 ['🧑🏻　📝','누가 먼저 발표할까?','🧑🏽　💬','어제 본 영상 있잖아!'],
 ['🗣️　💥　🗣️','두 사람 목소리가 커져요.','😣　　😣','잠깐 쉬고 싶어.'],
 ['🙋🏻　🧑🏽','나도 의견 있는데…','📋　🧑🏽','역할은 이렇게 정하자!'],
 ['🤫　🤫　🧑🏻','쉬는 시간에 수군수군','🧑🏻　🚶🏻','다음 날도 또 그래요.'],
 ['🧑🏻　🎒','가방에 새 키링','🧑🏻　✨　🧑🏽','이거 봐!']
];
const bonusScenes=[scenes[0],['🧑🏽　💬　🧑🏻','모둠 친구들이 이야기 중','🧑🏻　📣','아, 내 말 좀 들어!'],scenes[2],scenes[11]];
function drawComic(card){
 const comic=$('comic');
 comic.hidden=!card;
 if(!card)return;
 const art=scenes[cards.indexOf(card)]||bonusScenes[special.indexOf(card)];
 comic.replaceChildren();
 for(let i=0;i<4;i+=2){
  const frame=document.createElement('div');frame.className='frame';
  const speech=document.createElement('div');speech.className='bubble';speech.textContent=art[i+1];
  const cast=document.createElement('div');cast.className='cast';cast.textContent=art[i];
  frame.append(speech,cast);comic.append(frame);
 }
}
const $=id=>document.getElementById(id);
const names=['민트팀','주황팀'], colors=['mint','orange'];
let teams=[],active=0,phase='setup',face=0,land=0,animation=0;
function draw(){
 const tiles=track.map((card,i)=>{
  const cell=document.createElement('div');
  cell.className='tile'+(card[0].startsWith('★')?' special':'')+(phase==='answer'&&i===land?' land':'');
  cell.textContent=(i+1)+(card[0].startsWith('★')?' ★':'');
  cell.title=card[0];
  const row=Math.floor(i/6), col=i%6;
  cell.style.gridRow=row+1;
  cell.style.gridColumn=(row%2?6-col:col+1);
  const direction=document.createElement('span');direction.className='direction';
  direction.textContent=i===23?'↻':col===5?'↓':row%2?'←':'→';cell.append(direction);
  const marks=document.createElement('div');marks.className='markers';
  teams.forEach((team,t)=>{
   if(team.distance===0||(team.distance-1)%track.length!==i)return;
   const token=document.createElement('span');token.className='token '+colors[t];token.textContent=t===0?'민':'주';marks.append(token);
  });
  cell.append(marks);return cell;
 });
 $('track').replaceChildren(...tiles);
 ['scoreA','scoreB'].forEach((id,t)=>{
  const team=teams[t];
  $(id).textContent=names[t]+' · '+(team?team.distance+'칸 · '+team.done+'/'+team.queue.length+'명':'출발');
 });
}
function render(){
 draw();
 const team=teams[active], done=phase==='end', answering=phase==='answer';
 $('setup').hidden=phase!=='setup';$('game').hidden=phase==='setup';
 if(phase==='setup')return;
 $('roll').hidden=done||answering;
 $('roll').disabled=phase==='rolling';
 $('actions').hidden=!answering;$('again').hidden=!done;
 drawComic(answering?track[land]:null);$('hintText').hidden=true;$('die').textContent=face?'⚀⚁⚂⚃⚄⚅'[face-1]+' '+face:'';
 if(done){
  const [a,b]=teams.map((t,i)=>t.distance*teams[1-i].queue.length);
  $('status').textContent='모든 학생이 미션을 마쳤어요!';
  $('title').textContent=a===b?'공동 우승!':names[a>b?0:1]+' 우승!';
  $('scene').textContent=teams[0].queue.length===teams[1].queue.length?'':teams.map((t,i)=>names[i]+' 평균 '+(t.distance/t.queue.length).toFixed(2)+'칸').join(' · ');$('question').textContent='오늘 내가 써 보고 싶은 한마디는?';return;
 }
 $('status').textContent=names[active]+' '+team.queue[team.done]+'번 차례';
 $('title').textContent=answering?(land+1)+'번 칸 · '+track[land][0]:'주사위를 굴려요';
 $('scene').textContent=answering?track[land][1]:'';
 $('question').textContent=answering?track[land][2]:'';
 if(answering){
  const choices=team.queue.slice(team.done+1);
  $('swapBox').hidden=choices.length===0;
  $('swap').replaceChildren(new Option('번호 선택',''),...choices.map(n=>new Option(n+'번',n)));
 }
}
$('setup').onsubmit=e=>{
 e.preventDefault();
 teams=['a','b'].map(id=>({queue:Array.from({length:$(id).valueAsNumber},(_,i)=>i+1),distance:0,done:0}));
 active=0;phase='roll';face=0;render();
};
$('roll').onclick=()=>{
 if(phase!=='roll')return;
 phase='rolling';render();let spins=0;
 animation=setInterval(()=>{
  face=1+Math.floor(Math.random()*6);
  $('die').textContent='⚀⚁⚂⚃⚄⚅'[face-1]+' '+face;
  if(++spins<7)return;
  clearInterval(animation);
  teams[active].distance+=face;
  land=(teams[active].distance-1)%track.length;
  phase='answer';render();
 },75);
};
$('swap').onchange=()=>{
 const n=Number($('swap').value);
 if(!n||phase!=='answer')return;
 const team=teams[active], index=team.queue.indexOf(n,team.done+1);
 if(index<0)return;
 [team.queue[team.done],team.queue[index]]=[team.queue[index],team.queue[team.done]];
 render();$('swapBox').hidden=true;
};
$('hint').onclick=()=>{$('hintText').textContent=track[land][3];$('hintText').hidden=!$('hintText').hidden;};
$('next').onclick=()=>{
 if(phase!=='answer')return;
 teams[active].done++;
 if(teams.every(t=>t.done===t.queue.length))phase='end';
 else {if(teams[1-active].done<teams[1-active].queue.length)active=1-active;phase='roll';face=0;}
 render();
};
function reset(){clearInterval(animation);teams=[];face=0;phase='setup';render();}
$('again').onclick=reset;
$('reset').onclick=()=>{if(phase==='setup'||confirm('지금 경기를 처음부터 다시 시작할까요?'))reset();};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{alert('브라우저의 전체 화면 기능을 사용해 주세요.');}};
render();
</script></html>
